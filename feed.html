<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapapp - Dunia Yako</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
body{background:#f0f2f5;font-family:system-ui}
.post-card{background:white;border-radius:16px;overflow:hidden}
.btn-like.active{color:#e11d48}
</style>
</head>
<body>

<!-- HEADER - LOGO -->
<div class="sticky top-0 z-50 bg-white shadow px-4 py-3 flex justify-between items-center">
  <div class="flex items-center gap-2">
    <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-black text-xl">K</div>
    <div><h1 class="font-black text-xl leading-none text-blue-600">KAPAPP</h1><p class="text-[11px] text-gray-500">Dunia Yako, Sauti Yako</p></div>
  </div>
  <div class="flex gap-2">
    <button onclick="showPage('home')" class="bg-blue-100 px-3 py-1 rounded-full text-sm font-bold">🏠 Home</button>
    <button onclick="showPage('dashboard')" class="bg-gray-100 px-3 py-1 rounded-full text-sm font-bold">📊 Dashboard</button>
  </div>
</div>

<!-- TABS -->
<div class="max-w-md mx-auto px-3 mt-3 flex gap-2">
  <button onclick="filterPosts('all')" class="flex-1 bg-blue-600 text-white py-2 rounded-full font-bold text-sm">Dunia 🌍</button>
  <button onclick="showAllPosts()" class="flex-1 bg-black text-white py-2 rounded-full font-bold text-sm">See All →</button>
  <button onclick="showPage('dashboard')" class="flex-1 bg-white py-2 rounded-full font-bold text-sm border">Yangu</button>
</div>

<!-- HOME -->
<div id="page-home" class="max-w-md mx-auto p-3">
  <div class="bg-white p-4 rounded-2xl shadow mb-4">
    <input id="userName" placeholder="Jina lako..." class="w-full border rounded-xl p-3 mb-2 font-bold">
    <input id="userPhone" placeholder="Namba ya WhatsApp (mfano 255...)" class="w-full border rounded-xl p-3 mb-2">
    <textarea id="postText" placeholder="What's on your mind? KARIBUNI KAPAPP..." class="w-full border rounded-xl p-3 h-20"></textarea>
    <input type="file" id="postImage" accept="image/*" class="w-full text-sm my-2">
    <button onclick="createPost()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-black text-lg">POST SASA</button>
  </div>
  <div id="feed"></div>
  <button onclick="showAllPosts()" class="w-full bg-black text-white py-3 rounded-xl font-bold my-3">SEE ALL POSTS → Ona Zote</button>
</div>

<!-- SEE ALL PAGE -->
<div id="page-all" class="max-w-md mx-auto p-3 hidden">
  <h2 class="font-black text-xl mb-3">Post Zote 🌍 <button onclick="showPage('home')" class="text-sm bg-gray-200 px-3 py-1 rounded-full float-right">X Funga</button></h2>
  <input oninput="searchPosts(this.value)" placeholder="🔍 Tafuta post..." class="w-full border p-3 rounded-xl mb-3 bg-white">
  <div id="allFeed"></div>
</div>

<!-- DASHBOARD -->
<div id="page-dashboard" class="max-w-md mx-auto p-3 hidden">
  <div class="bg-blue-600 text-white p-5 rounded-2xl text-center">
    <div class="w-20 h-20 bg-white text-blue-600 rounded-full mx-auto flex items-center justify-center text-3xl font-black">K</div>
    <h2 id="dashName" class="font-black text-xl mt-2">Said Kapwile</h2>
    <p class="text-blue-100 text-sm">Mwanachama wa Kapapp</p>
    <div class="flex justify-center gap-4 mt-4">
      <div class="bg-white/20 rounded-xl px-4 py-2"><b id="dashPosts">0</b><br><span class="text-xs">Post</span></div>
      <div class="bg-white/20 rounded-xl px-4 py-2"><b id="dashLikes">0</b><br><span class="text-xs">Likes</span></div>
      <div class="bg-white/20 rounded-xl px-4 py-2"><b id="dashComments">0</b><br><span class="text-xs">Comments</span></div>
    </div>
  </div>
  <div class="bg-white rounded-2xl p-4 mt-3">
    <h3 class="font-bold mb-2">Post Zangu</h3>
    <div id="myFeed"></div>
  </div>
  <button onclick="logout()" class="w-full bg-red-500 text-white py-3 rounded-xl font-bold mt-3">Toka / Logout</button>
  <button onclick="showPage('home')" class="w-full bg-gray-200 py-3 rounded-xl font-bold mt-2">← Rudi Home</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "WEKA-APIPO",
  authDomain: "WEKA-APIPO",
  projectId: "WEKA-APIPO",
  storageBucket: "WEKA-APIPO",
  messagingSenderId: "WEKA-APIPO",
  appId: "WEKA-APIPO"
};
let db=null;
try{ firebase.initializeApp(firebaseConfig); db=firebase.firestore(); }catch(e){ console.log("Local mode"); }

let posts = JSON.parse(localStorage.getItem('kapapp_posts')||'[]');
if(posts.length===0){
  posts=[{id:Date.now(), name:"Said Kapwile", phone:"255000000000", text:"KARIBUNI HUMU JAMANI KAPAPP NDO HII", img:"", likes:12, comments:[{name:"Kapapp",text:"Karibu sana!"}], time:new Date().toLocaleString()}];
}
function save(){ localStorage.setItem('kapapp_posts', JSON.stringify(posts)); render(); }
function createPost(){
  let text=document.getElementById('postText').value;
  let name=document.getElementById('userName').value||"Mgeni";
  let phone=document.getElementById('userPhone').value||"255000000000";
  if(!text) return alert("Andika kitu kwanza!");
  let file=document.getElementById('postImage').files[0];
  if(file){
    let r=new FileReader(); r.onload=e=>{ posts.unshift({id:Date.now(),name,phone,text,img:e.target.result,likes:0,comments:[],time:new Date().toLocaleString()}); save(); document.getElementById('postText').value=""; }; r.readAsDataURL(file);
  } else {
    posts.unshift({id:Date.now(),name,phone,text,img:"",likes:0,comments:[],time:new Date().toLocaleString()}); save(); document.getElementById('postText').value="";
  }
}
function likePost(id,btn){ let p=posts.find(x=>x.id==id); p.likes++; save(); btn.classList.add('active'); }
function toggleComments(id){ document.getElementById('c-'+id).classList.toggle('hidden'); }
function addComment(id){
  let inp=document.getElementById('inp-'+id); if(!inp.value) return;
  let p=posts.find(x=>x.id==id); p.comments.push({name:"Wewe",text:inp.value}); inp.value=""; save(); toggleComments(id); toggleComments(id);
}
function deletePost(id){ if(confirm("Futa hii post?")){ posts=posts.filter(x=>x.id!=id); save(); } }
function sharePost(text){ let u="https://wa.me/?text="+encodeURIComponent(text+" - kupitia Kapapp"); window.open(u); }
function whatsappUser(phone,text){ let msg="Habari! Nimeona post yako Kapapp: "+text; window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg)); }
function postHTML(p){
  let comments = p.comments.map(c=>`<div class="bg-gray-100 rounded-lg p-2 mb-1 text-sm"><b>${c.name}:</b> ${c.text}</div>`).join('');
  return `<div class="post-card shadow mb-4">
    <div class="p-3 flex justify-between"><div><b>${p.name}</b><p class="text-xs text-gray-400">${p.time}</p></div><button onclick="deletePost(${p.id})" class="bg-red-500 text-white px-3 py-1 rounded-lg text-sm font-bold">❌ Futa Hii</button></div>
    <p class="px-3 pb-2">${p.text}</p>
    ${p.img?`<img src="${p.img}" class="w-full">`:''}
    <div class="p-3 flex gap-2">
      <button onclick="likePost(${p.id},this)" class="btn-like flex-1 bg-gray-100 py-2 rounded-full font-bold text-sm">❤️ Like (${p.likes})</button>
      <button onclick="toggleComments(${p.id})" class="flex-1 bg-gray-100 py-2 rounded-full font-bold text-sm">💬 Comment (${p.comments.length})</button>
      <button onclick="whatsappUser('${p.phone}','${p.text.replace(/'/g,"")}')" class="flex-1 bg-green-500 text-white py-2 rounded-full font-bold text-sm">🟢 WhatsApp</button>
    </div>
    <div class="px-3 pb-2 flex gap-2"><button onclick="sharePost('${p.text.replace(/'/g,"")}')" class="flex-1 border py-1 rounded-full text-sm">↗️ Share</button></div>
    <div id="c-${p.id}" class="px-3 pb-3 hidden"><div class="mb-2">${comments||'<p class="text-sm text-gray-400">Hakuna comment bado. Kuwa wa kwanza!</p>'}</div><div class="flex gap-2"><input id="inp-${p.id}" placeholder="Andika comment..." class="flex-1 border rounded-full px-3 py-2 text-sm"><button onclick="addComment(${p.id})" class="bg-blue-600 text-white px-4 rounded-full font-bold">Tuma</button></div></div>
  </div>`;
}
function render(){
  document.getElementById('feed').innerHTML = posts.slice(0,5).map(postHTML).join('');
  document.getElementById('allFeed').innerHTML = posts.map(postHTML).join('');
  let my = posts.filter(p=>p.name===document.getElementById('userName').value || p.name==="Said Kapwile");
  document.getElementById('myFeed').innerHTML = my.length? my.map(postHTML).join('') : '<p class="text-sm text-gray-500">Bado huna post. Post sasa!</p>';
  document.getElementById('dashPosts').innerText = posts.length;
  document.getElementById('dashLikes').innerText = posts.reduce((a,b)=>a+b.likes,0);
  document.getElementById('dashComments').innerText = posts.reduce((a,b)=>a+b.comments.length,0);
}
function showPage(p){
  document.getElementById('page-home').classList.add('hidden');
  document.getElementById('page-all').classList.add('hidden');
  document.getElementById('page-dashboard').classList.add('hidden');
  document.getElementById('page-'+p).classList.remove('hidden');
  render(); window.scrollTo(0,0);
}
function showAllPosts(){ showPage('all'); }
function filterPosts(){ showPage('home'); }
function searchPosts(q){
  let f=posts.filter(p=>p.text.toLowerCase().includes(q.toLowerCase())||p.name.toLowerCase().includes(q.toLowerCase()));
  document.getElementById('allFeed').innerHTML=f.map(postHTML).join('')||'<p class="text-center py-5">Hakuna kilichopatikana</p>';
}
function logout(){ alert("Umetoka. Asante kutumia Kapapp!"); showPage('home'); }
render();
</script>
</body>
</html>
