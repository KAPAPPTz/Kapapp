<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kapapp</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f0f2f5;color:#050505;padding-bottom:70px}
header{position:fixed;top:0;left:0;right:0;background:#fff;padding:8px 10px;z-index:99;display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
header h1{font-size:30px;color:#1877f2;font-weight:900}
header .right{margin-left:auto;display:flex;gap:8px}
header .right span{width:38px;height:38px;background:#f0f2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer}
.wrap{margin-top:58px}
.mind{background:#fff;padding:10px;display:flex;gap:8px;align-items:center}
.mind img{width:40px;height:40px;border-radius:50%;background:#ddd;object-fit:cover}
.mind input{flex:1;padding:11px 14px;border-radius:25px;border:0;background:#f0f2f5}
.story{min-width:105px;height:218px;border-radius:12px;position:relative;overflow:hidden;background:#ddd}
.story img{width:100%;height:100%;object-fit:cover}
.story .lab{position:absolute;bottom:6px;left:6px;color:#fff;font-weight:bold;font-size:13px;text-shadow:0 0 5px #000}
.post{background:#fff;margin:8px 0;padding:12px}
.head{display:flex;gap:8px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:20px}
.post img,.post video{width:100%;max-height:450px;object-fit:cover;display:block}
.actions{display:flex;justify-content:space-between;border-top:1px solid #eee;padding:8px 0;color:#65676b}
.box{background:#fff;margin:8px;padding:14px;border-radius:8px}
.box input,.box textarea,.box select{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #ddd;background:#f0f2f5}
.box button{width:100%;padding:12px;background:#1877f2;color:#fff;border:0;border-radius:8px;font-weight:bold}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:6px 0;border-top:1px solid #ddd;z-index:99}
.bottom div{text-align:center;font-size:24px;color:#65676b;flex:1}.bottom div.active{color:#1877f2}
.hidden{display:none}
#authScreen{position:fixed;inset:0;background:#f0f2f5;z-index:999;padding:20px;text-align:center}
#authScreen h1{font-size:48px;color:#1877f2;margin-top:30px}
.authBox{background:#fff;padding:18px;border-radius:8px;margin:18px auto;max-width:400px}
.authBox input{width:100%;padding:13px;margin:7px 0;border-radius:6px;border:1px solid #ddd}
.authBox button{width:100%;padding:12px;border:0;border-radius:6px;font-weight:bold;margin-top:8px}
.menuItem{background:#fff;padding:14px;margin:6px 8px;border-radius:8px;display:flex;justify-content:space-between}
</style>
</head>
<body>
