<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAPAPP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f2f5;padding-bottom:80px}
.header{background:#1877f2;color:white;padding:15px;text-align:center}
.box{background:white;margin:15px;padding:20px;border-radius:15px;text-align:center}
.box input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;font-size:16px}
.box button{background:#1877f2;color:white;border:none;padding:14px;width:100%;border-radius:20px;font-weight:bold;font-size:17px}
.box button.green{background:#00a400}
.wallet{background:white;margin:10px;padding:15px;border-radius:12px;text-align:center}
.wallet h2{color:#1877f2;font-size:28px}
.post-box{background:white;margin:10px;padding:12px;border-radius:12px}
.post-box textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:12px;min-height:60px}
.post-box button{background:#1877f2;color:white;border:none;padding:12px;width:100%;border-radius:20px;font-weight:bold;margin-top:8px}
.post{background:white;margin:10px;border-radius:12px;padding:12px}
.post button{border:none;background:#eee;padding:8px 15px;border-radius:20px;margin-right:5px}
.top{background:white;margin:10px;padding:10px;border-radius:10px;display:flex;justify-content:space-between}
.top button{background:#ff4444;color:white;border:none;padding:6px 12px;border-radius:15px}
.link{color:#1877f2;text-decoration:underline;margin-top:10px;display:block}
#msg{color:green;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<div id="loginScreen">
<div class="header"><h1>KAPAPP 🌍</h1><p>Iko kwenye Server sasa - Haijai tena!</p></div>
<div class="box" id="ingiaBox">
<h2>INGIA</h2><br>
<input id="namba" placeholder="Namba ya Simu">
<input id="pass" type="password" placeholder="Password">
<button onclick="ingia()">INGIA</button>
<p id="msg"></p>
<a class="link" onclick="onyeshaJisajili()">Huna akaunti? Jisajili hapa</a>
</div>
<div class="box" id="jisajiliBox" style="display:none">
<h2>JISAJILI</h2><br>
<input id="jinaJ" placeholder="Jina lako">
<input id="nambaJ" placeholder="Namba ya Simu">
<input id="passJ" type="password" placeholder="Weka Password">
<button class="green" onclick="jisajili()">JISAJILI SASA</button>
<p id="msg2"></p>
<a class="link" onclick="onyeshaIngia()">Umeshaingia? Ingia hapa</a>
</div>
</div>

<div id="mainScreen" style="display:none">
<div class="header"><h1>KAPAPP 🌍</h1></div>
<div class="top"><span>👤 <b id="showJina"></b><br><small id="showNamba"></small></span><button onclick="toka()">Toka</button></div>
<div class="wallet"><p>💰 MFUKO WAKO</p><h2><span id="pesa">0</span> TZS</h2><p>Post = 50 | Like = 10 | Comment = 5</p></div>
<div class="post-box"><textarea id="maandishi" placeholder="Unafikiria nini leo?"></textarea><button onclick="tumaPost()">📝 CHAPISHA POST +50 TZS</button></div>
<div id="feed"></div>
</div>

<script>
var pesa=0;
var posts=[{jina:"KAPAPP",txt:"Karibu KAPAPP! Post hapa, watu wakipenda unapata 10 TZS!",likes:12}];
var jinaLangu="";
function onyeshaJisajili(){document.getElementById('ingiaBox').style.display='none';document.getElementById('jisajiliBox').style.display='block';}
function onyeshaIngia(){document.getElementById('jisajiliBox').style.display='none';document.getElementById('ingiaBox').style.display='block';}
function jisajili(){
var j=document.getElementById('jinaJ').value;
var n=document.getElementById('nambaJ').value;
var p=document.getElementById('passJ').value;
if(j==""||n==""||p==""){document.getElementById('msg2').innerHTML="Jaza vyote kwanza!";return;}
jinaLangu=j;
document.getElementById('showJina').innerHTML=j;
document.getElementById('showNamba').innerHTML=n;
document.getElementById('loginScreen').style.display='none';
document.getElementById('mainScreen').style.display='block';
onyesha();
}
function ingia(){
var n=document.getElementById('namba').value;
var p=document.getElementById('pass').value;
if(n==""||p==""){document.getElementById('msg').innerHTML="Andika Namba na Password!";return;}
if(jinaLangu=="") jinaLangu="Mgeni";
document.getElementById('showJina').innerHTML=jinaLangu;
document.getElementById('showNamba').innerHTML=n;
document.getElementById('loginScreen').style.display='none';
document.getElementById('mainScreen').style.display='block';
onyesha();
}
function toka(){document.getElementById('mainScreen').style.display='none';document.getElementById('loginScreen').style.display='block';}
function onyesha(){
document.getElementById('pesa').innerHTML=pesa;
var h="";
for(var i=0;i<posts.length;i++){h+='<div class="post"><b>'+posts[i].jina+'</b><p style="margin:8px 0">'+posts[i].txt+'</p><button onclick="like('+i+')">❤️ Like ('+posts[i].likes+')</button><button onclick="comment('+i+')">💬 Comment</button></div>';}
document.getElementById('feed').innerHTML=h;
}
function tumaPost(){
var t=document.getElementById('maandishi').value;
if(t==""){return;}
posts.unshift({jina:jinaLangu,txt:t,likes:0});
pesa=pesa+50;
onyesha();
document.getElementById('maandishi').value='';
}
function like(i){posts[i].likes++;pesa=pesa+10;onyesha();}
function comment(i){pesa=pesa+5;onyesha();}
</script>
</body>
</html>
