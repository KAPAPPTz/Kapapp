<html lang="sw">
<head>
<meta charset="UTF-8">

<title>KAPAPP - Pata Pesa na Marafiki</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f0f2f5;padding-bottom:80px}
.header{background:#1877f2;color:white;padding:12px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{font-size:24px}
.wallet{background:white;margin:10px;padding:15px;border-radius:12px;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.1)}
.wallet h2{color:#1877f2;font-size:28px}
.wallet p{font-size:13px;color:#666;margin-top:4px}
.wallet button{background:#00a400;color:white;border:none;padding:10px 20px;border-radius:20px;font-weight:bold;margin-top:10px}
.post-box{background:white;margin:10px;padding:12px;border-radius:12px}
.post-box input{width:100%;padding:10px;border:1px solid #ddd;border-radius:20px;margin-bottom:8px}
.post-box button{background:#1877f2;color:white;border:none;padding:10px;width:100%;border-radius:20px;font-weight:bold}
.post{background:white;margin:10px;border-radius:12px;overflow:hidden}
.post-head{padding:10px;display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;background:#1877f2;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px}
.post-body{padding:0 12px 10px}
.post-img{width:100%;max-height:300px;object-fit:cover}
.actions{display:flex;justify-content:space-around;border-top:1px solid #eee;padding:8px}
.actions button{border:none;background:none;font-size:15px;padding:6px 12px;border-radius:20px}
.actions button.liked{background:#e7f3ff;color:#1877f2}
.comments{padding:8px 12px;background:#f9f9f9;font-size:14px}
.comments input{width:100%;padding:8px;border-radius:20px;border:1px solid #ddd;margin-top:5px}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:12px;border-top:1px solid #ddd}
.nav a{text-decoration:none;color:#333;font-weight:bold;font-size:14px}
