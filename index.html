<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAPAPP - Dunia Yetu</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui} .post-card{border-radius:16px;overflow:hidden}</style>
</head>
<body class="bg-gray-100">

<!-- LOGIN / JISAJILI -->
<div id="page-login" class="max-w-md mx-auto p-4 min-h-screen flex flex-col justify-center">
<div class="text-center mb-5">
<div class="w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center mx-auto text-white text-4xl font-bold">K</div>
<h1 class="text-3xl font-bold text-blue-600 mt-2">KAPAPP</h1>
<p class="text-gray-500">Dunia Yako, Sauti Yako 🌍</p>
<p class="text-sm font-bold text-red-500 mt-1">Mambo ni moto</p>
</div>

<div class="bg-white p-5 rounded-2xl shadow">
<div class="flex gap-2 mb-4">
<button id="btnLoginTab" onclick="switchAuth('login')" class="flex-1 bg-gray-200 py-2 rounded-full font-bold">INGIA</button>
<button id="btnRegTab" onclick="switchAuth('register')" class="flex-1 bg-blue-600 text-white py-2 rounded-full font-bold">JISAJILI</button>
</div>

<!-- INGIA -->
<div id="form-login">
<input id="loginPhone" type="tel" placeholder="Namba ya simu - mfano 0688472790" class="w-full border p-3 rounded-xl mb-3">
<input id="loginPass" type="password" placeholder="Password" class="w-full border p-3 rounded-xl mb-2">
<button onclick="doLogin()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">INGIA SASA</button>
<p onclick="showForgot()" class="text-center text-blue-600 font-bold text-sm mt-3 cursor-pointer">Umesahau Password? Bonyeza hapa</p>
<p id="loginMsg" class="text-center text-red-500 text-sm mt-2"></p>
</div>

<!-- JISAJILI -->
<div id="form-register" class="hidden">
<input id="regName" type="text" placeholder="Jina lako kamili" class="w-full border p-3 rounded-xl mb-3">
<input id="regPhone" type="tel" placeholder="Namba ya simu" class="w-full border p-3 rounded-xl mb-3">
<input id="regPass" type="password" placeholder="Weka Password mpya" class="w-full border p-3 rounded-xl mb-3">
<button onclick="doRegister()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">JISAJILI SASA</button>
<p id="regMsg" class="text-center text-red-500 text-sm mt-2"></p>
</div>

<!-- SAHAU PASSWORD -->
<div id="form-forgot" class="hidden">
<p class="text-center font-bold mb-3">Badilisha Password</p>
<input id="forgotPhone" type="tel" placeholder="Weka namba uliyosajili nayo" class="w-full border p-3 rounded-xl mb-3">
<input id="forgotPass" type="password" placeholder="Password mpya" class="w-full border p-3 rounded-xl mb-3">
<input id="forgotPass2" type="password" placeholder="Rudia Password mpya" class="w-full border p-3 rounded-xl mb-3">
<button onclick="doForgot()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">BADILISHA PASSWORD</button>
<p onclick="showLoginFromForgot()" class="text-center text-gray-500 text-sm mt-3 cursor-pointer">Rudi kuingia</p>
<p id="forgotMsg" class="text-center text-sm mt-2"></p>
</div>

<p class="text-center text-gray-400 text-xs mt-4">Dunia Yetu 🌍 - Karibu Kapapp</p>
</div>
</div>

<!-- NDANI YA KAPAPP -->
<div id="page-home" class="hidden max-w-md mx-auto p-4">
<div class="flex justify-between items-center bg-white p-3 rounded-xl shadow mb-3">
<b class="text-blue-600 text-xl">KAPAPP</b>
<span id="userNameShow" class="text-sm font-bold"></span>
<button onclick="doLogout()" class="text-red-500 text-sm font-bold">Toka</button>
</div>
<div class="bg-white p-3 rounded-xl shadow mb-3">
<textarea id="postText" placeholder="Andika chochote..." class="w-full border p-3 rounded-xl"></textarea>
<button onclick="addPost()" class="w-full bg-blue-600 text-white py-2 rounded-xl font-bold mt-2">POST</button>
</div>
<div id="feed"></div>
</div>

<script>
let users = JSON.parse(localStorage.getItem('kapapp_users')||'[]');
let posts = JSON.parse(localStorage.getItem('kapapp_posts')||'[]');
let currentUser = JSON.parse(localStorage.getItem('kapapp_current')||'null');

function switchAuth(t){
  document.getElementById('form-login').classList.toggle('hidden', t!=='login');
  document.getElementById('form-register').classList.toggle('hidden', t!=='register');
  document.getElementById('form-forgot').classList.add('hidden');
  document.getElementById('btnLoginTab').className = t==='login' ? 'flex-1 bg-blue-600 text-white py-2 rounded-full font-bold' : 'flex-1 bg-gray-200 py-2 rounded-full font-bold';
  document.getElementById('btnRegTab').className = t==='register' ? 'flex-1 bg-blue-600 text-white py-2 rounded-full font-bold' : 'flex-1 bg-gray-200 py-2 rounded-full font-bold';
}
function showForgot(){
  document.getElementById('form-login').classList.add('hidden');
  document.getElementById('form-register').classList.add('hidden');
  document.getElementById('form-forgot').classList.remove('hidden');
}
function showLoginFromForgot(){ switchAuth('login'); }

function doRegister(){
  let n=document.getElementById('regName').value.trim();
  let p=document.getElementById('regPhone').value.trim();
  let pw=document.getElementById('regPass').value.trim();
  if(!n||!p||!pw){ document.getElementById('regMsg').innerText='Jaza kila kitu'; return; }
  if(users.find(u=>u.phone===p)){ document.getElementById('regMsg').innerText='Namba hii imeshasajiliwa. Ingia au badilisha password.'; return; }
  let u={name:n,phone:p,pass:pw};
  users.push(u); localStorage.setItem('kapapp_users',JSON.stringify(users));
  currentUser=u; localStorage.setItem('kapapp_current',JSON.stringify(u));
  openHome();
}
function doLogin(){
  let p=document.getElementById('loginPhone').value.trim();
  let pw=document.getElementById('loginPass').value.trim();
  let u=users.find(x=>x.phone===p && x.pass===pw);
  if(!u){ document.getElementById('loginMsg').innerText='Namba au password sio sahihi. Kama umesahau, bonyeza Umesahau Password?'; return; }
  currentUser=u; localStorage.setItem('kapapp_current',JSON.stringify(u));
  openHome();
}
function doForgot(){
  let p=document.getElementById('forgotPhone').value.trim();
  let pw=document.getElementById('forgotPass').value.trim();
  let pw2=document.getElementById('forgotPass2').value.trim();
  let msg=document.getElementById('forgotMsg');
  if(!p||!pw||!pw2){ msg.style.color='red'; msg.innerText='Jaza kila kitu'; return; }
  if(pw!==pw2){ msg.style.color='red'; msg.innerText='Password mbili hazifanani'; return; }
  let idx=users.findIndex(x=>x.phone===p);
  if(idx===-1){ msg.style.color='red'; msg.innerText='Namba hii haijasajiliwa. Tafadhali jisajili kwanza.'; return; }
  users[idx].pass=pw; localStorage.setItem('kapapp_users',JSON.stringify(users));
  currentUser=users[idx]; localStorage.setItem('kapapp_current',JSON.stringify(currentUser));
  msg.style.color='green'; msg.innerText='Password imebadilika! Unaingia sasa...';
  setTimeout(openHome, 1000);
}
function doLogout(){ localStorage.removeItem('kapapp_current'); location.reload(); }
function openHome(){
  document.getElementById('page-login').classList.add('hidden');
  document.getElementById('page-home').classList.remove('hidden');
  document.getElementById('userNameShow').innerText = currentUser.name + ' - ' + currentUser.phone;
  renderFeed();
}
function addPost(){
  let t=document.getElementById('postText').value.trim();
  if(!t) return;
  posts.unshift({name:currentUser.name, phone:currentUser.phone, text:t, time:new Date().toLocaleString()});
  localStorage.setItem('kapapp_posts',JSON.stringify(posts));
  document.getElementById('postText').value=''; renderFeed();
}
function renderFeed(){
  document.getElementById('feed').innerHTML = posts.map(p=>`<div class="bg-white p-3 rounded-xl shadow mb-3"><b>${p.name}</b> <span class="text-gray-400 text-xs">${p.phone}</span><p class="mt-1">${p.text}</p><p class="text-xs text-gray-400">${p.time}</p></div>`).join('');
}
if(currentUser) openHome(); else switchAuth('register');
</script>
</body>
</html>
