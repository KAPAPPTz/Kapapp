<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAPAPP</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f5}
.top{background:#1877f2;color:white;padding:12px;text-align:center;font-size:22px;font-weight:bold;position:sticky;top:0}
.box,.post{background:white;margin:10px;padding:12px;border-radius:10px}
input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:5px 0;box-sizing:border-box}
button{background:#1877f2;color:white;border:0;padding:10px 20px;border-radius:8px;font-weight:bold;width:100%;cursor:pointer}
.post img{width:100%;border-radius:10px;margin-top:8px}
.actions{display:flex;justify-content:space-between;margin-top:10px;border-top:1px solid #eee;padding-top:8px}
.actions span{cursor:pointer}
</style>
</head>
<body>
<div class="top">KAPAPP</div>

<div class="box">
<input id="jina" placeholder="Jina lako...">
<textarea id="wazo" rows="3" placeholder="Una wazo gani leo?"></textarea>
<input type="file" id="picha" accept="image/*">
<button onclick="tuma()">Post</button>
</div>

<div id="feed"></div>

<script>
function tuma(){
let jina=document.getElementById('jina').value || 'KAPAPP';
let wazo=document.getElementById('wazo').value;
let file=document.getElementById('picha').files[0];
if(!wazo && !file){alert('Andika kitu kwanza!');return;}
let div=document.createElement('div');
div.className='post';
let imgTag='';
if(file){imgTag='<img src="'+URL.createObjectURL(file)+'">';}
div.innerHTML='<b>'+jina+'</b><p>'+wazo+'</p>'+imgTag+'<div class="actions"><span onclick="like(this)">👍 Like (<b>0</b>)</span><span>💬 Comment</span><span>↗️ Share</span></div>';
document.getElementById('feed').prepend(div);
document.getElementById('wazo').value='';
document.getElementById('picha').value='';
}
function like(el){
let b=el.querySelector('b');
b.innerText=parseInt(b.innerText)+1;
}
</script>
</body>
</html>
