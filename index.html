<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAPAPP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f0f2f5}
.top{background:#fff;padding:10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;box-shadow:0 1px 5px #ccc}
.top b{color:#1877f2;font-size:24px}
.box{background:#fff;margin:10px;padding:10px;border-radius:10px}
input,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{width:100%;padding:12px;background:#1877f2;color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:bold}
.post{background:#fff;margin:10px;padding:10px;border-radius:10px}
.post img,.post video{width:100%;border-radius:8px;margin-top:8px}
.small{color:#1877f2;text-align:center;margin-top:10px}
.story{display:flex;gap:8px;overflow:auto}
.story div{min-width:90px;height:140px;background:#1877f2;color:#fff;border-radius:10px;padding:10px;font-weight:bold}
</style>
</head>
<body>

<div id="loginPage" class="box" style="margin-top:60px">
<h1 style="color:#1877f2;text-align:center">KAPAPP</h1>
<p style="text-align:center">Ingia au Jiandikishe</p>
<input id="phone" placeholder="Namba ya Simu - mf 0755000000">
<input id="pass" type="password" placeholder="Password">
<input id="jina" placeholder="Jina Lako (kwa wanao jiandikisha mara ya kwanza)">
<button onclick="ingia()">INGIA</button>
<button onclick="jiandikishe()" style="background:#42b72a;margin-top:8px">JIANDIKISHE MPYA</button>
<p id="msg" style="text-align:center;color:red"></p>
</div>

<div id="app" style="display:none">
<div class="top"><b>KAPAPP</b><span id="myName" style="margin-left:auto"></span><button onclick="toka()" style="width:auto;padding:6px 12px;background:red">Toka</button></div>

<div class="box">
<textarea id="txt" placeholder="What's on your mind?"></textarea>
<input type="file" id="file" accept="image/*,video/*">
<button onclick="post()">POST SASA</button>
</div>

<div class="box"><b>Story</b><div class="story"><div onclick="alert('Tengeneza Story - chagua picha hapo juu uki-post')">+ Tengeneza Story</div><div>Kapwile 👑</div><div>Rafiki</div></div></div>

<div id="feed"></div>
</div>

<script>
let users=JSON.parse(localStorage.getItem('kapapp_users')||'[]');
let posts=JSON.parse(localStorage.getItem('kapapp_posts')||'[]');
let me=localStorage.getItem('kapapp_me');

function jiandikishe(){
let p=phone.value.trim(),w=pass.value.trim(),j=jina.value.trim();
if(!p||!w||!j){msg.innerText='Jaza Namba, Password na Jina';return}
if(users.find(u=>u.phone==p)){msg.innerText='Namba hii ishaandikishwa, Ingia tu';return}
users.push({phone:p,pass:w,name:j});localStorage.setItem('kapapp_users',JSON.stringify(users));
msg.style.color='green';msg.innerText='Umejiandikisha! Sasa bonyeza INGIA';
}
function ingia(){
let p=phone.value.trim(),w=pass.value.trim();
let u=users.find(x=>x.phone==p&&x.pass==w);
if(!u){msg.innerText='Namba au Password sio sahihi';return}
me=p;localStorage.setItem('kapapp_me',p);onyesha();
}
function toka(){localStorage.removeItem('kapapp_me');location.reload()}
function onyesha(){
let u=users.find(x=>x.phone==me);if(!u)return;
loginPage.style.display='none';app.style.display='block';myName.innerText='👋 '+u.name;
feed.innerHTML='';
for(let i=posts.length-1;i>=0;i--){let po=posts[i];
feed.innerHTML+='<div class="post"><b>'+po.name+'</b><div>'+po.txt+'</div>'+(po.media? (po.type=='v'?'<video controls src="'+po.media+'"></video>':'<img src="'+po.media+'">'):'')+'</div>'}
}
function post(){
let u=users.find(x=>x.phone==me);if(!u)return;
let f=file.files[0];
if(f){let r=new FileReader();r.onload=function(){save(r.result,f.type.includes('video')?'v':'i')};r.readAsDataURL(f)}
else save('','');
}
function save(media,type){
let u=users.find(x=>x.phone==me);
posts.push({name:u.name,txt:txt.value,media:media,type:type});
localStorage.setItem('kapapp_posts',JSON.stringify(posts));txt.value='';file.value='';onyesha();
}
if(me)onyesha();
</script>
</body>
</html>
