<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KA-PAPP 🌍</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f2f2f2}
header{background:#ff2d55;color:#fff;text-align:center;padding:12px 10px;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:24px}
header p{margin:2px;font-size:13px}
.topbar{background:#fff;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.topbar select,.topbar input{padding:8px;border-radius:20px;border:1px solid #ddd}
.topbar input{flex:1;min-width:140px}
.btn{background:#ff2d55;color:#fff;border:none;padding:8px 14px;border-radius:20px;cursor:pointer}
.card{background:#fff;margin:10px;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img.post-img{width:100%;max-height:380px;object-fit:cover;display:block}
.card-body{padding:12px}
.profile-row{display:flex;align-items:center;gap:10px}
.avatar{width:55px;height:55px;border-radius:50%;object-fit:cover;background:#ff2d55;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;cursor:pointer;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.follow{margin-left:auto;background:#ff2d55;color:#fff;border:none;padding:6px 12px;border-radius:20px}
.actions{display:flex;justify-content:space-between;margin-top:10px}
.actions button{border:1px solid #eee;background:#f9f9f9;padding:8px;border-radius:20px;flex:1;margin:2px;cursor:pointer}
.profile-box{background:#fff;margin:10px;padding:15px;border-radius:14px;text-align:center}
.profile-box .avatar{width:100px;height:100px;font-size:45px;margin:0 auto}
input,textarea,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
.hidden{display:none}
</style>
</head>
<body>

<header>
<h1>KA-PAPP 🌍</h1>
<p>Every Language. Every Currency. Every Country.</p>
</header>

<!-- LOGIN -->
<div id="loginBox" class="profile-box">
<h3>Ingia KA-PAPP</h3>
<input id="jinaInput" placeholder="Andika jina lako mf: Said Kapwile">
<button class="btn" onclick="ingia()">Ingia</button>
</div>

<!-- PROFILE YANGU -->
<div id="profileBox" class="profile-box hidden">
<div class="avatar" onclick="document.getElementById('pichaInput').click()">
<span id="herufiYangu">S</span>
<img id="pichaYangu" class="hidden">
</div>
<input type="file" id="pichaInput" accept="image/*" hidden onchange="wekaPicha(event)">
<h3 id="jinaLangu"></h3>
<p style="font-size:13px;color:#666">Bonyeza picha juu kubadilisha picha yako 👆</p>
<button class="btn" onclick="toka()">Toka / Logout</button>
</div>

<div class="topbar">
<select id="lugha"><option>Kiswahili</option><option>English</option><option>Français</option></select>
<select id="pesa"><option>TSh</option><option>KSh</option><option>$ USD</option></select>
<input id="tafuta" placeholder="🔍 Tafuta bidhaa... #V" oninput="onyeshaPosts()">
<button class="btn">💬 DM</button>
</div>

<!-- POST MPYA -->
<div class="card hidden" id="postBox">
<div class="card-body">
<h3>Weka Bidhaa Yako</h3>
<input id="beiInput" placeholder="Bei mf: TSh 100">
<input id="bidhaaInput" placeholder="Jina la bidhaa mf: Machungwa">
<input id="maelezoInput" placeholder="Maelezo mf: Tunapatikana Kerege">
<input type="file" id="pichaBidhaa" accept="image/*">
<button class="btn" onclick="wekaPost()">Post Bidhaa</button>
</div>
</div>

<div id="feed"></div>

<script>
let mtumiaji = localStorage.getItem('ka_user') || '';
let posts = JSON.parse(localStorage.getItem('ka_posts') || '[]');

function ingia(){
  let j = document.getElementById('jinaInput').value.trim();
  if(!j) return alert('Andika jina kwanza');
  localStorage.setItem('ka_user', j);
  mtumiaji = j; location.reload();
}
function toka(){ localStorage.removeItem('ka_user'); location.reload(); }

function wekaPicha(e){
  let f = e.target.files[0]; if(!f) return;
  let r = new FileReader();
  r.onload = function(ev){
    localStorage.setItem('picha_' + mtumiaji, ev.target.result);
    onyeshaProfile();
    onyeshaPosts();
  };
  r.readAsDataURL(f);
}
function pichaYa(jina){ return localStorage.getItem('picha_' + jina) || ''; }
function onyeshaProfile(){
  if(!mtumiaji) return;
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('profileBox').classList.remove('hidden');
  document.getElementById('postBox').classList.remove('hidden');
  document.getElementById('jinaLangu').innerText = 'Umeingia kama ' + mtumiaji;
  document.getElementById('herufiYangu').innerText = mtumiaji.charAt(0).toUpperCase();
  let p = pichaYa(mtumiaji);
  if(p){
    document.getElementById('pichaYangu').src = p;
    document.getElementById('pichaYangu').classList.remove('hidden');
    document.getElementById('herufiYangu').classList.add('hidden');
  }
}
function wekaPost(){
  let bei = document.getElementById('beiInput').value || 'TSh 100';
  let bidhaa = document.getElementById('bidhaaInput').value || 'Bidhaa';
  let maelezo = document.getElementById('maelezoInput').value || '';
  let file = document.getElementById('pichaBidhaa').files[0];
  if(file){
    let r = new FileReader();
    r.onload = function(e){ hifadhiPost(bei,bidhaa,maelezo,e.target.result); };
    r.readAsDataURL(file);
  } else hifadhiPost(bei,bidhaa,maelezo,'https://via.placeholder.com/600x400?text=KA-PAPP');
}
function hifadhiPost(bei,bidhaa,maelezo,picha){
  posts.unshift({jina:mtumiaji, bei, bidhaa, maelezo, picha, likes:0});
  localStorage.setItem('ka_posts', JSON.stringify(posts));
  onyeshaPosts();
}
function onyeshaPosts(){
  let s = document.getElementById('tafuta').value.toLowerCase();
  let feed = document.getElementById('feed'); feed.innerHTML = '';
  // Post ya mfano kama hakuna
  let zote = posts.length ? posts : [{jina:'Said Kapwile', bei:'TSh 100', bidhaa:'Machungwa', maelezo:'Tunapatikana Kerege - #MatamuSana', picha:'https://images.unsplash.com/photo-1582979518144-b9e3e3c8f3b7?w=600', likes:5}];
  zote.forEach((p,i)=>{
    if(s && !(p.bidhaa+p.maelezo+p.jina).toLowerCase().includes(s)) return;
    let pp = pichaYa(p.jina);
    let avatar = pp ? `<img src="${pp}">` : p.jina.charAt(0);
    feed.innerHTML += `
    <div class="card">
      <img class="post-img" src="${p.picha}">
      <div class="card-body">
        <div class="profile-row">
          <div class="avatar">${avatar}</div>
          <b>${p.jina}</b>
          <button class="follow" onclick="this.innerText='✓ Following'">+ FOLLOW</button>
        </div>
        <h3 style="color:green;margin:8px 0 2px">${p.bei}</h3>
        <b>${p.bidhaa}</b><br>${p.maelezo}
        <div class="actions">
          <button onclick="this.innerText='❤️ '+(parseInt(this.innerText.replace(/[^0-9]/g,'')||0)+1)">❤️ Like</button>
          <button>💬 Comment</button>
          <button>↗️ Share</button>
          <button>💬 DM</button>
        </div>
      </div>
    </div>`;
  });
}
onyeshaProfile(); onyeshaPosts();
</script>
</body>
</html>
