<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAPAPP V2 - Dunia Nzima</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f2f5}
.header{background:#FFD700;padding:10px 12px;position:sticky;top:0;z-index:99}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px}
.logo span{background:#000;color:#FFD700;padding:2px 7px;border-radius:8px}
.dunia{font-size:13px;font-weight:700}
.user-row{display:flex;align-items:center;gap:8px;margin-top:8px;background:#fff;padding:6px;border-radius:20px}
.user-row img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.toka{background:#000;color:#FFD700;border:none;padding:5px 12px;border-radius:15px;font-weight:700}
.container{max-width:500px;margin:auto;padding:10px}
.post-box{background:#fff;padding:12px;border-radius:12px;margin-bottom:12px}
.post-box textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:10px;min-height:60px}
.post-box input{width:100%;margin-top:8px;padding:9px;border:1px solid #ddd;border-radius:8px}
.btn-post{background:#FFD700;border:none;width:100%;padding:11px;border-radius:8px;font-weight:900;margin-top:8px;cursor:pointer}
.card{background:#fff;border-radius:12px;margin-bottom:14px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:8px;padding:10px}
.card-head img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.card-head b{font-size:14px}
.card-head small{color:#777;display:block}
.card p{padding:0 12px 10px;font-size:15px}
.card video,.card img.post-img{width:100%;max-height:400px;object-fit:cover;background:#000}
.actions{display:flex;justify-content:space-around;padding:10px;border-top:1px solid #eee}
.actions button{border:none;background:none;font-size:15px;cursor:pointer;font-weight:700}
.actions button.liked{color:red}
.comments{padding:0 12px 12px;display:none}
.comments div{background:#f0f2f5;padding:7px 10px;border-radius:10px;margin-bottom:5px;font-size:14px}
.comments input{width:78%;padding:8px;border:1px solid #ddd;border-radius:20px}
.comments button{padding:8px 12px;border:none;background:#FFD700;border-radius:20px;font-weight:700}
.dm-box{background:#e7f3ff;padding:10px;border-radius:10px;margin:10px;display:none}
.dm-box input{width:70%;padding:8px;border-radius:20px;border:1px solid #ddd}
.dm-box button{padding:8px 12px;background:#25D366;border:none;border-radius:20px;color:#fff;font-weight:700}
</style>
</head>
<body>
<div class="header">
<div class="top"><div class="logo"><span>K</span> KAPAPP</div><div class="dunia">🌍 Dunia Nzima</div></div>
<div class="user-row"><img src="https://i.pravatar.cc/100?img=12"><b id="myName">Said Kapwile</b><small style="flex:1">Dar esalam</small><button class="toka" onclick="alert('Umetoka!')">Toka</button></div>
</div>

<div class="container">
<div class="post-box">
<h3>📝 Post Kitu - Watu Waone!</h3>
<textarea id="postText" placeholder="Andika hapa... Nini kipya?"></textarea>
<input id="postMedia" placeholder="Weka link ya Picha / Video (YouTube au picha link)">
<input type="file" id="fileInput" accept="image/*,video/*">
<button class="btn-post" onclick="addPost()">🚀 POST SASA - Watu Waone!</button>
<p style="font-size:12px;color:#777;margin-top:6px">Video: Chagua file kutoka simu yako (dakika 3-5) au weka link.</p>
</div>

<div id="feed"></div>

<div style="text-align:center;padding:20px;color:#777;font-size:13px">KAPAPP V2 - Said Kapwile - Dar esalam<br>WhatsApp: 0688472790</div>
</div>

<script>
let posts = JSON.parse(localStorage.getItem('kapapp_posts')||'[]');
if(posts.length==0){
posts=[
{id:1,name:"Said Kapwile",time:"Sasa hivi",text:"🔥 Karibu KAPAPP V2! Sasa unaweza ku-Post, ku-Like, ku-Comment, ku-Share na ku-DM! Jaribu sasa!",img:"https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=500",likes:12,comments:[{n:"Mteja",t:"Hongera mkuu! App kali!"}]},
{id:2,name:"Kapapp Soko",time:"Dakika 5",text:"🏢 Kampuni ya kwanza Dar esalam! Tuna bidhaa kali! DM kwa oda!",img:"https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=500",likes:25,comments:[]}
];
save();
}
function save(){localStorage.setItem('kapapp_posts',JSON.stringify(posts))}
function render(){
let h='';
posts.slice().reverse().forEach(p=>{
h+=`<div class="card">
<div class="card-head"><img src="https://i.pravatar.cc/100?img=12"><div><b>${p.name}</b><small>${p.time} • Dar esalam</small></div><button onclick="openDM('${p.name}')" style="margin-left:auto;background:#25D366;color:#fff;border:none;padding:6px 10px;border-radius:15px">📩 DM</button></div>
<p>${p.text}</p>
${p.img?`<img class="post-img" src="${p.img}">`:''}
${p.video?`<video controls src="${p.video}"></video>`:''}
<div class="actions">
<button id="like-${p.id}" onclick="likePost(${p.id})">❤️ Like (${p.likes})</button>
<button onclick="toggleC(${p.id})">💬 Comment (${p.comments.length})</button>
<button onclick="sharePost('${p.text}')">🔁 Share</button>
</div>
<div class="comments" id="c-${p.id}">
${p.comments.map(c=>`<div><b>${c.n}:</b> ${c.t}</div>`).join('')}
<div style="display:flex;gap:5px"><input id="in-${p.id}" placeholder="Andika comment..."><button onclick="addComment(${p.id})">Tuma</button></div>
</div>
<div class="dm-box" id="dm-${p.id}"><b>DM kwa ${p.name}</b><br><br><input id="dmIn-${p.id}" placeholder="Andika meseji..."><button onclick="sendDM(${p.id})">Tuma WhatsApp</button></div>
</div>`;
});
document.getElementById('feed').innerHTML=h;
}
function addPost(){
let t=document.getElementById('postText').value;
let m=document.getElementById('postMedia').value;
let f=document.getElementById('fileInput').files[0];
if(!t && !m && !f){alert('Andika kitu kwanza!');return;}
let newPost={id:Date.now(),name:"Said Kapwile",time:"Sasa hivi",text:t||"Video mpya!",img:"",video:"",likes:0,comments:[]};
if(f){
let url=URL.createObjectURL(f);
if(f.type.startsWith('video')) newPost.video=url; else newPost.img=url;
} else if(m){
if(m.includes('.mp4')) newPost.video=m; else newPost.img=m;
}
posts.push(newPost); save(); render();
document.getElementById('postText').value=''; document.getElementById('postMedia').value='';
alert('✅ Imepostiwa! Watu sasa wanaiona!');
}
function likePost(id){
let p=posts.find(x=>x.id==id); p.likes++; save(); render();
}
function toggleC(id){let e=document.getElementById('c-'+id); e.style.display=e.style.display=='block'?'none':'block';}
function addComment(id){
let v=document.getElementById('in-'+id).value; if(!v) return;
let p=posts.find(x=>x.id==id); p.comments.push({n:"Wewe",t:v}); save(); render();
}
function sharePost(t){
let link="https://kapapptz.github.io/Kapapp/";
let txt=encodeURIComponent(t+" - Tazama kwenye KAPAPP: "+link);
window.open("https://wa.me/?text="+txt,"_blank");
}
function openDM(name){
let all=document.querySelectorAll('.dm-box'); all.forEach(e=>e.style.display='none');
let p=posts.find(x=>x.name==name);
if(p){let e=document.getElementById('dm-'+p.id); e.style.display='block';}
}
function sendDM(id){
let p=posts.find(x=>x.id==id);
let msg=document.getElementById('dmIn-'+id).value;
if(!msg){alert('Andika meseji');return;}
window.open("https://wa.me/255688472790?text="+encodeURIComponent("Habari "+p.name+"! Kuhusu post yako: "+msg),"_blank");
}
render();
</script>
</body>
</html>
