<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KA-PAPP 🌍</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f2f2f2;padding-bottom:30px}
header{background:#ff2d55;color:#fff;text-align:center;padding:14px 10px;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:26px}
header p{margin:2px;font-size:13px}
.topbar{background:#fff;padding:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;position:sticky;top:68px;z-index:9}
.topbar select,.topbar input{padding:9px;border-radius:20px;border:1px solid #ddd}
.topbar input{flex:1;min-width:130px}
.btn{background:#ff2d55;color:#fff;border:none;padding:10px 16px;border-radius:20px;cursor:pointer;font-weight:bold}
.btn2{background:#000;color:#fff;border:none;padding:8px 12px;border-radius:20px;cursor:pointer}
.card{background:#fff;margin:10px;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.card img.post-img{width:100%;max-height:380px;object-fit:cover;display:block;background:#eee}
.card-body{padding:12px}
.profile-row{display:flex;align-items:center;gap:10px}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#ff2d55;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;cursor:pointer;overflow:hidden;flex-shrink:0;border:2px solid #ff2d55}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-big{width:105px;height:105px;font-size:48px;margin:0 auto;border:3px solid #ff2d55}
.follow{margin-left:auto;background:#ff2d55;color:#fff;border:none;padding:7px 14px;border-radius:20px;cursor:pointer}
.actions{display:flex;justify-content:space-between;margin-top:12px;gap:4px}
.actions button{border:1px solid #eee;background:#f9f9f9;padding:9px 4px;border-radius:20px;flex:1;cursor:pointer;font-size:13px}
.profile-box{background:#fff;margin:10px;padding:16px;border-radius:16px;text-align:center}
input,textarea,select{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
.hidden{display:none}
.badge{background:#ffeef1;color:#ff2d55;padding:4px 10px;border-radius:20px;font-size:12px}
.comment-box{display:flex;gap:5px;margin-top:8px}
.comment-box input{flex:1}
</style>
</head>
<body>

<header>
<h1>KA-PAPP 🌍</h1>
<p>Every Language. Every Currency. Every Country.</p>
</header>

<!-- LOGIN -->
<div id="loginBox" class="profile-box">
<h3>Karibu KA-PAPP 👋</h3>
<p>Andika jina lako uingie</p>
<input id="jinaInput" placeholder="Mf: Said Kapwile">
<button class="btn" onclick="ingia()">INGIA ▶️</button>
</div>

<!-- PROFILE YANGU -->
<div id="profileBox" class="profile-box hidden">
<div class="avatar avatar-big" onclick="document.getElementById('pichaInput').click()" title="Bonyeza kubadilisha picha">
<span id="herufiYangu">S</span>
<img id="pichaYangu" class="hidden">
</div>
<input type="file" id="pichaInput" accept="image/*" hidden onchange="wekaPicha(event)">
<h3 id="jinaLangu"></h3>
<span class="badge">👤 Profile Yangu</span>
<p style="font-size:14px;color:#555">👆 Bonyeza picha yako hapo juu kubadilisha / kuweka picha mpya</p>
<button class="btn2" onclick="toka()">Toka / Logout</button>
</div>

<div class="topbar">
<select id="lugha" onchange="badilishaLugha()"><option value="sw">Kiswahili</option><option value="en">English</option><option value="fr">Français</option></select>
<select id="pesa" onchange="onyeshaPosts()"><option>TSh</option><option>KSh</option><option>$ USD</option><option>€ EUR</option></select>
<input id="tafuta" placeholder="🔍 Tafuta bidhaa... #V" oninput="onyeshaPosts()">
<button class="btn2" onclick="alert('DM inakuja! Chagua mtu umtume ujumbe')">💬 DM</button>
</div>

<!-- POST MPYA -->
<div class="card hidden" id="postBox">
<div class="card-body">
<h3>📦 Weka Bidhaa Yako</h3>
<input id="bidhaaInput" placeholder="Jina la bidhaa Mf: Machungwa">
<input id="beiInput" placeholder="Bei Mf: 100">
<input id="maelezoInput" placeholder="Maelezo Mf: Tunapatikana Kerege">
<label style="font-size:13px">Picha ya bidhaa:</label>
<input type="file" id="pichaBidhaa" accept="image/*">
<button class="btn" onclick="wekaPost()">POST BIDHAA ✅</button>
</div>
</div>

<div id="feed"></div>

<script>
let mtumiaji = localStorage.getItem('ka_user') || '';
let posts = JSON.parse(localStorage.getItem('ka_posts') || '[]');
let follows = JSON.parse(localStorage.getItem('ka_follows') || '{}');

function ingia(){
  let j = document.getElementById('jinaInput').value.trim();
  if(!j) return alert('Andika jina lako kwanza');
  localStorage.setItem('ka_user', j);
  mtumiaji = j; location.reload();
}
function toka(){ localStorage.removeItem('ka_user'); location.reload(); }

function wekaPicha(e){
  let f = e.target.files[0]; if(!f) return;
  let r = new FileReader();
  r.onload = function(ev){
    localStorage.setItem('picha_' + mtumiaji, ev.target.result);
    onyeshaProfile(); onyeshaPosts();
    alert('Picha yako imewekwa! ✅');
  };
  r.readAsDataURL(f);
}
function pichaYa(jina){ return localStorage.getItem('picha_' + jina) || ''; }

function onyeshaProfile(){
  if(!mtumiaji) return;
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('profileBox').classList.remove('hidden');
  document.getElementById('postBox').classList.remove('hidden');
  document.getElementById('jinaLangu').innerText = 'Umeingia kama ' + mtumiaji;
  document.getElementById('herufiYangu').innerText = mtumiaji.charAt(0).toUpperCase();
  let p = pichaYa(mtumiaji);
  if(p){
    document.getElementById('pichaYangu').src = p;
    document.getElementById('pichaYangu').classList.remove('hidden');
    document.getElementById('herufiYangu').classList.add('hidden');
  }
}
function wekaPost(){
  let bidhaa = document.getElementById('bidhaaInput').value.trim() || 'Bidhaa';
  let bei = document.getElementById('beiInput').value.trim() || '100';
  let maelezo = document.getElementById('maelezoInput').value.trim() || 'Karibu KA-PAPP';
  let file = document.getElementById('pichaBidhaa').files[0];
  let pesa = document.getElementById('pesa').value;
  if(file){
    let r = new FileReader();
    r.onload = function(e){ hifadhiPost(bidhaa,bei,maelezo,e.target.result,pesa); };
    r.readAsDataURL(file);
  } else hifadhiPost(bidhaa,bei,maelezo,'https://images.unsplash.com/photo-1582979518144-b9e3e3c8f3b7?w=600',pesa);
}
function hifadhiPost(bidhaa,bei,maelezo,picha,pesa){
  posts.unshift({jina:mtumiaji, bidhaa, bei, maelezo, picha, pesa, likes:0, comments:[]});
  localStorage.setItem('ka_posts', JSON.stringify(posts));
  document.getElementById('bidhaaInput').value=''; document.getElementById('beiInput').value=''; document.getElementById('maelezoInput').value='';
  onyeshaPosts(); alert('Bidhaa imepostwa! ✅');
}
function likePost(i,btn){
  posts[i].likes = (posts[i].likes||0)+1;
  localStorage.setItem('ka_posts', JSON.stringify(posts));
  btn.innerText = '❤️ ' + posts[i].likes;
}
function followUser(jina,btn){
  follows[jina]=true; localStorage.setItem('ka_follows', JSON.stringify(follows));
  btn.innerText='✓ Following'; btn.style.background='#000';
}
function commentPost(i){
  let inp = document.getElementById('cmt'+i);
  let txt = inp.value.trim(); if(!txt) return;
  posts[i].comments = posts[i].comments||[];
  posts[i].comments.push(mtumiaji+': '+txt);
  localStorage.setItem('ka_posts', JSON.stringify(posts));
  onyeshaPosts();
}
function sharePost(p){
  let txt = p.bidhaa+' - '+p.pesa+' '+p.bei+' - '+p.maelezo+' - KA-PAPP';
  if(navigator.share){ navigator.share({text:txt}); } else { alert(txt); }
}
function badilishaLugha(){ alert('Lugha imebadilishwa: '+document.getElementById('lugha').value); }

function onyeshaPosts(){
  let s = document.getElementById('tafuta').value.toLowerCase();
  let feed = document.getElementById('feed'); feed.innerHTML='';
  let zote = posts.length ? posts : [
    {jina:'Said Kapwile', bidhaa:'Machungwa', bei:'100', maelezo:'Tunapatikana Kerege - #MatamuSana', picha:'https://images.unsplash.com/photo-1582979518144-b9e3e3c8f3b7?w=600', pesa:'TSh', likes:5, comments:['Juma: Safi sana']},
    {jina:'Mama Ntilie', bidhaa:'Mchele Mzuri', bei:'2500', maelezo:'Mchele wa Morogoro, karibu sana', picha:'https://images.unsplash.com/photo-1586201375761-83865001e31c?w=600', pesa:'TSh', likes:12, comments:[]}
  ];
  zote.forEach((p,i)=>{
    if(s && !(p.bidhaa+' '+p.maelezo+' '+p.jina).toLowerCase().includes(s)) return;
    let pp = pichaYa(p.jina);
    let avatar = pp ? `<img src="${pp}">` : p.jina.charAt(0).toUpperCase();
    let cmtHtml = (p.comments||[]).map(c=>`<div style="background:#f5f5f5;padding:6px 10px;border-radius:10px;margin-top:4px;font-size:13px">💬 ${c}</div>`).join('');
    let followTxt = follows[p.jina] ? '✓ Following' : '+ FOLLOW';
    feed.innerHTML += `
    <div class="card">
      <img class="post-img" src="${p.picha}">
      <div class="card-body">
        <div class="profile-row">
          <div class="avatar">${avatar}</div>
          <div><b>${p.jina}</b><br><span style="font-size:12px;color:#888">KA-PAPP • ${p.pesa||'TSh'}</span></div>
          <button class="follow" onclick="followUser('${p.jina}',this)">${followTxt}</button>
        </div>
        <h3 style="color:green;margin:10px 0 2px">${p.pesa||'TSh'} ${p.bei}</h3>
        <b>${p.bidhaa}</b><br><span style="color:#444">${p.maelezo}</span>
        ${cmtHtml}
        <div class="comment-box"><input id="cmt${i}" placeholder="Andika comment..."><button class="btn2" onclick="commentPost(${i})">Tuma</button></div>
        <div class="actions">
          <button onclick="likePost(${i},this)">❤️ ${p.likes||0}</button>
          <button onclick="document.getElementById('cmt${i}').focus()">💬 Comment</button>
          <button onclick='sharePost(${JSON.stringify(p).replace(/'/g,"")})'>↗️ Share</button>
          <button onclick="alert('Umemtumia DM ${p.jina}')">💬 DM</button>
        </div>
      </div>
    </div>`;
  });
}
onyeshaProfile(); onyeshaPosts();
</script>
</body>
</html>
