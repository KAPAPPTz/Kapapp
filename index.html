<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapapp</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f0f2f5;display:flex;justify-content:center;min-height:100vh}
.box{width:100%;max-width:420px;background:white;min-height:100vh;padding:25px}
.logo{text-align:center;font-size:32px;font-weight:900;color:#1877f2;margin:30px 0 5px}
.sub{text-align:center;color:#777;margin-bottom:25px}
h2{text-align:center;margin:10px 0}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:16px;outline:none}
input:focus{border-color:#1877f2}
button{width:100%;padding:14px;border:none;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-blue{background:#1877f2;color:white}
.btn-green{background:#42b72a;color:white}
.btn-red{background:#ff3b30;color:white}
.link{text-align:center;color:#1877f2;margin-top:15px;cursor:pointer;font-weight:bold}
.msg{text-align:center;color:red;font-weight:bold;min-height:20px}
.card{background:#e7f3ff;padding:20px;border-radius:15px;text-align:center;margin-top:20px}
.card h1{margin:0;color:#1877f2}
.hidden{display:none}
.menu{margin-top:20px}
.item{background:#f5f5f5;padding:15px;border-radius:12px;margin:8px 0;font-weight:bold}
</style>
</head>
<body>
<div class="box">

<div id="authPage">
<div class="logo">Kapapp</div>
<div class="sub">Karibu kwenye Kapapp</div>

<!-- Kujisajili -->
<div id="registerBox">
<h2>Jisajili</h2>
<div class="msg" id="regMsg"></div>
<input id="regName" type="text" placeholder="Jina kamili">
<input id="regPhone" type="tel" placeholder="Namba ya simu - mf 0712345678">
<input id="regPass" type="password" placeholder="Password">
<button class="btn-green" onclick="jisajili()">JISAJILI</button>
<div class="link" onclick="onyeshaLogin()">Una akaunti? Bonyeza hapa kuingia</div>
</div>

<!-- Kuingia -->
<div id="loginBox" class="hidden">
<h2>Ingia</h2>
<div class="msg" id="loginMsg"></div>
<input id="loginPhone" type="tel" placeholder="Namba ya simu">
<input id="loginPass" type="password" placeholder="Password">
<button class="btn-blue" onclick="ingia()">INGIA</button>
<div class="link" onclick="onyeshaRegister()">Huna akaunti? Jisajili hapa</div>
</div>
</div>

<!-- Ndani ya App -->
<div id="appPage" class="hidden">
<div class="logo" style="font-size:24px">Kapapp</div>
<div class="card">
<p style="margin:0;color:#555">Karibu,</p>
<h1 id="userName">Said</h1>
<p id="userPhone" style="color:#555"></p>
</div>
<div class="menu">
<div class="item">🏠 Nyumbani</div>
<div class="item">👤 Akaunti Yangu</div>
<div class="item">⚙️ Mipangilio</div>
</div>
<button class="btn-red" onclick="toka()">TOKA / LOGOUT</button>
</div>

</div>

<script>
function getUsers(){
  try{ return JSON.parse(localStorage.getItem('kapapp_users')||'[]'); }catch(e){ return []; }
}
function saveUsers(u){ localStorage.setItem('kapapp_users', JSON.stringify(u)); }

function onyeshaLogin(){
  document.getElementById('registerBox').classList.add('hidden');
  document.getElementById('loginBox').classList.remove('hidden');
}
function onyeshaRegister(){
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('registerBox').classList.remove('hidden');
}

function jisajili(){
  var jina = document.getElementById('regName').value.trim();
  var simu = document.getElementById('regPhone').value.trim();
  var pass = document.getElementById('regPass').value.trim();
  var msg = document.getElementById('regMsg');

  if(!jina || !simu || !pass){ msg.textContent = 'Tafadhali jaza vyote!'; return; }
  if(pass.length < 4){ msg.textContent = 'Password iwe na herufi 4 au zaidi!'; return; }

  var users = getUsers();
  var ipo = users.find(function(u){ return u.phone === simu; });
  if(ipo){ msg.textContent = 'Namba hii imeshatumika! Ingia badala yake.'; return; }

  var mtumiajiMpya = { name: jina, phone: simu, pass: pass };
  users.push(mtumiajiMpya);
  saveUsers(users);
  localStorage.setItem('kapapp_current', JSON.stringify(mtumiajiMpya));
  funguaApp();
}

function ingia(){
  var simu = document.getElementById('loginPhone').value.trim();
  var pass = document.getElementById('loginPass').value.trim();
  var msg = document.getElementById('loginMsg');

  if(!simu || !pass){ msg.textContent = 'Jaza namba na password!'; return; }

  var users = getUsers();
  var user = users.find(function(u){ return u.phone === simu && u.pass === pass; });
  if(!user){ msg.textContent = 'Namba au Password si sahihi!'; return; }

  localStorage.setItem('kapapp_current', JSON.stringify(user));
  funguaApp();
}

function funguaApp(){
  var data = localStorage.getItem('kapapp_current');
  if(!data) return;
  var user;
  try{ user = JSON.parse(data); }catch(e){ user = { name: data, phone: '' }; }
  // Kama user ni string bado, badilisha kuwa object
  if(typeof user === 'string'){ user = { name: user, phone: '' }; }
  // Kama jina ni [object Object], chukua jina sahihi
  var jinaSahihi = user.name || 'Mgeni';
  if(jinaSahihi === '[object Object]') jinaSahihi = 'Mgeni';

  document.getElementById('userName').textContent = jinaSahihi;
  document.getElementById('userPhone').textContent = user.phone || '';
  document.getElementById('authPage').classList.add('hidden');
  document.getElementById('appPage').classList.remove('hidden');
}

function toka(){
  localStorage.removeItem('kapapp_current');
  document.getElementById('appPage').classList.add('hidden');
  document.getElementById('authPage').classList.remove('hidden');
  onyeshaLogin();
}

// Ukifungua app na umeshaingia, ingia moja kwa moja
window.onload = function(){
  if(localStorage.getItem('kapapp_current')){ funguaApp(); }
};
</script>
</body>
</html>
