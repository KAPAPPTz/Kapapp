<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAPAPP</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f5}
.top{background:#1877f2;color:white;padding:12px;text-align:center;font-size:22px;font-weight:bold;position:sticky;top:0;z-index:10}
.top small{font-size:12px;font-weight:normal;display:block}
.box,.post{background:white;margin:10px;padding:14px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
input,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin:6px 0;box-sizing:border-box;font-size:15px}
button{background:#1877f2;color:white;border:0;padding:12px;border-radius:8px;font-weight:bold;width:100%;cursor:pointer;font-size:16px}
.post img{width:100%;border-radius:10px;margin-top:8px}
.actions{display:flex;justify-content:space-between;margin-top:10px;border-top:1px solid #eee;padding-top:8px}
.actions span{cursor:pointer;font-size:14px}
.del{color:red;float:right;cursor:pointer}
.comments{margin-top:10px;background:#f0f2f5;padding:8px;border-radius:8px;font-size:14px}
.link{color:#1877f2;cursor:pointer;text-align:center;display:block;margin-top:10px}
</style>
</head>
<body>
<div class="top">KAPAPP<small id="userTop"></small></div>

<div id="authBox" class="box">
<h2 style="text-align:center;margin:0">Karibu KAPAPP</h2>
<p style="text-align:center;color:#555">Jisajili ili uanze kupost, kulike na kucomment.</p>
<input id="aJina" placeholder="Jina kamili...">
<input id="aEmail" placeholder="Email...">
<input id="aPass" type="password" placeholder="Password...">
<button onclick="authAction()">JISAJILI / INGIA</button>
<span class="link" onclick="badiliMode()" id="modeLink">Una akaunti? Bonyeza hapa kuingia</span>
</div>

<div id="appBox" style="display:none">
<div class="box">
<textarea id="wazo" rows="3" placeholder="Una wazo gani leo?"></textarea>
<button onclick="tuma()">Post</button>
<button onclick="toka()" style="background:#e4e6eb;color:#333;margin-top:8px">Toka</button>
</div>
<div id="feed"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, updateDoc, doc, deleteDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// *** WEKA CONFIG YAKO HAPA CHINI - BADILISHA HIZI 6 ***
const firebaseConfig = {
  apiKey: "WEKA_APIKEY_HAPA",
  authDomain: "WEKA_AUTHDOMAIN_HAPA",
  projectId: "WEKA_PROJECTID_HAPA",
  storageBucket: "WEKA_STORAGEBUCKET_HAPA",
  messagingSenderId: "WEKA_SENDERID_HAPA",
  appId: "WEKA_APPID_HAPA"
};
// *** MWISHO WA CONFIG ***

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let mode = 'sajili';
let currentName = localStorage.getItem('kapapp_name') || 'Mgeni';

window.badiliMode = () => {
  mode = mode === 'sajili' ? 'ingia' : 'sajili';
  document.getElementById('modeLink').innerText = mode === 'sajili' ? 'Una akaunti? Bonyeza hapa kuingia' : 'Huna akaunti? Bonyeza hapa kujisajili';
}
window.authAction = async () => {
  let jina = document.getElementById('aJina').value.trim();
  let email = document.getElementById('aEmail').value.trim();
  let pass = document.getElementById('aPass').value.trim();
  if(!email || !pass){ alert('Jaza email na password!'); return; }
  try{
    if(mode === 'sajili'){
      if(!jina){ alert('Jaza jina!'); return; }
      await createUserWithEmailAndPassword(auth, email, pass);
      localStorage.setItem('kapapp_name', jina);
      alert('Hongera '+jina+'! Umesajiliwa!');
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch(e){ alert(e.message); }
}
window.toka = async () => { await signOut(auth); location.reload(); }
window.tuma = async () => {
  let wazo = document.getElementById('wazo').value.trim();
  if(!wazo){ alert('Andika kitu kwanza!'); return; }
  await addDoc(collection(db, 'posts'), { jina: currentName, wazo: wazo, likes: 0, comments: [], time: new Date().toLocaleString('sw-TZ') });
  document.getElementById('wazo').value = '';
}
window.like = async (id, likes) => { await updateDoc(doc(db, 'posts', id), { likes: likes + 1 }); }
window.futa = async (id) => { if(confirm('Ufute hii post?')) await deleteDoc(doc(db, 'posts', id)); }
window.comment = async (id, input) => {
  if(!input.value.trim()) return;
  await updateDoc(doc(db, 'posts', id), { comments: arrayUnion({ jina: currentName, txt: input.value.trim() }) });
  input.value = '';
}

onAuthStateChanged(auth, (user) => {
  if(user){
    document.getElementById('authBox').style.display = 'none';
    document.getElementById('appBox').style.display = 'block';
    document.getElementById('userTop').innerText = 'Karibu, ' + currentName;
  }
});

const q = query(collection(db, 'posts'), orderBy('time', 'desc'));
onSnapshot(q, (snap) => {
  let feed = document.getElementById('feed');
  feed.innerHTML = '';
  if(snap.empty){ feed.innerHTML = '<p style="text-align:center;color:#888">Hakuna post bado. Kuwa wa kwanza kupost!</p>'; return; }
  snap.forEach((d) => {
    let p = d.data(); let id = d.id;
    let div = document.createElement('div'); div.className = 'post';
    let cmt = (p.comments || []).map(c => '<div><b>'+c.jina+':</b> '+c.txt+'</div>').join('');
    div.innerHTML = '<span class="del" onclick="futa(\''+id+'\')">✖</span><b>'+p.jina+'</b> <small style="color:#888">• '+p.time+'</small><p>'+p.wazo+'</p><div class="actions"><span onclick="like(\''+id+'\','+p.likes+')">👍 Like (<b>'+p.likes+'</b>)</span><span>💬 Comment ('+(p.comments||[]).length+')</span><span onclick="alert(\'Link imekopiwa! Tuma kwa rafiki.\')">↗️ Share</span></div><div class="comments">'+cmt+'<input placeholder="Andika comment..." onkeydown="if(event.key===\'Enter\') comment(\''+id+'\',this)"></div>';
    feed.appendChild(div);
  });
});
</script>
</body>
</html>
