<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAPAPP - Post • Like • Pata Pesa</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f0f2f5;padding-bottom:80px}
header{background:#1877f2;color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header b{font-size:20px}
header span{font-size:14px;background:#fff;color:#1877f2;padding:4px 10px;border-radius:20px;font-weight:bold}
.balance{background:#fff;margin:10px;padding:12px;border-radius:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.balance b{color:#0a9e3f;font-size:22px}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.user-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.avatar{width:38px;height:38px;border-radius:50%;background:#1877f2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px}
input,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px}
button{background:#1877f2;color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:bold}
button:active{opacity:.8}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.actions button{background:#eef2ff;color:#1877f2;padding:7px 12px}
.comment{background:#f0f2f5;padding:7px 10px;border-radius:8px;margin-top:6px;font-size:14px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:12px;border-top:1px solid #ddd}
.nav button{background:none;color:#333}
.nav button.active{color:#1877f2}
.hidden{display:none}
.login{max-width:400px;margin:40px auto;padding:20px;background:#fff;border-radius:12px}
.login h2{text-align:center;color:#1877f2;margin-bottom:15px}
</style>
</head>
<body>

<header>
<b>KAPAPP</b>
<span id="headerName">Karibu</span>
</header>

<!-- LOGIN -->
<div id="loginPage" class="login">
<h2>KAPAPP 🇹🇿</h2>
<p style="text-align:center;margin-bottom:10px">Post • Like • Pata Pesa</p>
<input id="loginName" placeholder="Andika jina lako - mfano Said">
<input id="loginPhone" placeholder="Namba ya simu (hiari)">
<button onclick="login()" style="width:100%">INGIA / JISAJILI</button>
<p style="font-size:12px;color:#666;text-align:center;margin-top:10px">Post = 50 TZS • Like = 10 TZS • Comment = 5 TZS</p>
</div>

<!-- APP -->
<div id="appPage" class="hidden">

<div class="balance">
👋 Habari, <b id="welcomeName"></b><br>
Mfuko Wako: <b id="myBalance">0 TZS</b><br>
<span id="myStats" style="font-size:13px;color:#666"></span>
</div>

<!-- FEED -->
<div id="feedPage">
<div class="card">
<textarea id="caption" placeholder="Andika kitu... #Kapapp"></textarea>
<input id="postUrl" placeholder="Link ya picha/video (hiari)">
<input type="file" id="postFile" accept="image/*,video/*">
<button id="postBtn" onclick="createPost()" style="width:100%">POST • +50 TZS</button>
<p id="uploadStatus" style="font-size:13px;color:#1877f2;text-align:center;margin-top:6px"></p>
</div>
<input id="searchInput" placeholder="🔍 Tafuta #hashtag au jina..." oninput="loadFeed()" style="margin:10px">
<div id="feedList"></div>
</div>

<!-- DM -->
<div id="dmPage" class="hidden">
<div class="card">
<h3>DM 💬</h3>
<input id="dmTo" placeholder="Tuma kwa nani? Andika jina">
<input id="dmText" placeholder="Andika ujumbe...">
<button onclick="sendDM()" style="width:100%">TUMA DM</button>
</div>
<div id="dmList"></div>
</div>

<!-- PROFILE -->
<div id="profilePage" class="hidden">
<div class="card" style="text-align:center">
<div class="avatar" id="profAvatar" style="margin:0 auto;width:70px;height:70px;font-size:30px">S</div>
<h3 id="profName"></h3>
<p id="profStats"></p>
<button onclick="logout()">TOKA / BADILISHA JINA</button>
</div>
<div id="myPosts"></div>
</div>

</div>

<div class="nav" id="bottomNav" style="display:none">
<button id="btnFeed" class="active" onclick="show('feed')">🏠 Feed</button>
<button id="btnDm" onclick="show('dm')">💬 DM</button>
<button id="btnProfile" onclick="show('profile')">👤 Mimi</button>
</div>

<script>
// ===== KAPAPP + CLOUDINARY =====
const CLOUD_NAME = 'izgmg90u';
const UPLOAD_PRESET = 'kapapp';

let me = "";
let myPhone = "";

function getData(k, def){ try{ return JSON.parse(localStorage.getItem(k)) || def }catch(e){ return def } }
function saveData(k, v){ localStorage.setItem(k, JSON.stringify(v)) }

async function uploadToCloudinary(file){
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {
    method: 'POST',
    body: formData
  });
  const data = await res.json();
  if(!data.secure_url) throw new Error(data.error?.message || 'Upload imeshindwa');
  return data.secure_url;
}

function loadUser(){
  let saved = localStorage.getItem('kapappUser');
  if(!saved) return false;
  try{
    let u = JSON.parse(saved);
    if(typeof u === 'object' && u !== null){ me = u.name || u.username || ""; } else { me = u; }
  }catch(e){ me = saved.replace(/[{}\"]/g,'').replace('name:','').replace(':', ''); }
  if(me.includes('{') || me.includes('"')){
    let m = me.match(/"name":"([^"]+)"/);
    if(m) me = m[1];
  }
  return me ? true : false;
}

function updateHeader(){
  document.getElementById('headerName').textContent = me || "Karibu";
  document.getElementById('welcomeName').textContent = me || "";
  document.getElementById('profName').textContent = me || "";
  document.getElementById('profAvatar').textContent = me ? me.charAt(0).toUpperCase() : "S";
}

function login(){
  let n = document.getElementById('loginName').value.trim();
  if(!n) return alert('Andika jina lako kwanza!');
  me = n;
  myPhone = document.getElementById('loginPhone').value.trim();
  saveData('kapappUser', {name: me, phone: myPhone});
  startApp();
}

function logout(){
  localStorage.removeItem('kapappUser');
  location.reload();
}

function startApp(){
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').classList.remove('hidden');
  document.getElementById('bottomNav').style.display = 'flex';
  updateHeader();
  loadFeed();
  loadDM();
  loadProfile();
}

function show(page){
  document.getElementById('feedPage').classList.add('hidden');
  document.getElementById('dmPage').classList.add('hidden');
  document.getElementById('profilePage').classList.add('hidden');
  document.getElementById('btnFeed').classList.remove('active');
  document.getElementById('btnDm').classList.remove('active');
  document.getElementById('btnProfile').classList.remove('active');
  if(page==='feed'){ document.getElementById('feedPage').classList.remove('hidden'); document.getElementById('btnFeed').classList.add('active'); loadFeed(); }
  if(page==='dm'){ document.getElementById('dmPage').classList.remove('hidden'); document.getElementById('btnDm').classList.add('active'); loadDM(); }
  if(page==='profile'){ document.getElementById('profilePage').classList.remove('hidden'); document.getElementById('btnProfile').classList.add('active'); loadProfile(); }
}

function getBalance(){ return getData('kapappBalance_'+me, 0); }
function addMoney(amount){ let b = getBalance() + amount; saveData('kapappBalance_'+me, b); document.getElementById('myBalance').textContent = b + " TZS"; }

async function createPost(){
  let caption = document.getElementById('caption').value.trim();
  let url = document.getElementById('postUrl').value.trim();
  let file = document.getElementById('postFile').files[0];
  if(!caption && !url && !file) return alert('Andika kitu kwanza!');

  let btn = document.getElementById('postBtn');
  let status = document.getElementById('uploadStatus');
  btn.disabled = true;
  btn.textContent = 'INAPAKIA...';

  try{
    let finalUrl = url;
    if(file){
      status.textContent = '⏳ Inapakia picha Cloudinary... subiri kidogo';
      finalUrl = await uploadToCloudinary(file);
      status.textContent = '✅ Picha imepakiwa!';
    }
    let posts = getData('kapappPosts', []);
    let hashtags = (caption.match(/#\w+/g) || []).join(' ');
    posts.unshift({id: Date.now(), user: me, caption: caption, media: finalUrl, type: '', tags: hashtags, likes: 0, likedBy: [], comments: [], time: new Date().toLocaleString()});
    saveData('kapappPosts', posts);
    addMoney(50);
    alert('Post imetumwa! ✅ +50 TZS');
    document.getElementById('caption').value = '';
    document.getElementById('postUrl').value = '';
    document.getElementById('postFile').value = '';
    status.textContent = '';
    show('feed');
  }catch(err){
    alert('Picha haikupakiwa: ' + err.message + '\nJaribu tena, angalia internet.');
    status.textContent = '❌ Imeshindwa, jaribu tena';
  }
  btn.disabled = false;
  btn.textContent = 'POST • +50 TZS';
}

function formatText(t){ return (t||'').replace(/#(\w+)/g, '<b style="color:#1877f2">#$1</b>'); }

function loadFeed(){
  let posts = getData('kapappPosts', []);
  let search = (document.getElementById('searchInput')?.value || '').toLowerCase();
  let html = '';
  if(posts.length===0) html = '<div class="card" style="text-align:center">Hakuna post bado.<br>Kuwa wa kwanza kupost!</div>';
  posts.forEach(p=>{
    if(search && !(p.caption||'').toLowerCase().includes(search) && !(p.user||'').toLowerCase().includes(search)) return;
    let media = '';
    if(p.media){
      if(p.media.startsWith('data:video') || p.media.includes('.mp4') || p.media.includes('/video/')) media = `<video src="${p.media}" controls style="width:100%;border-radius:8px;margin-top:8px"></video>`;
      else if(p.media.startsWith('http')) media = `<img src="${p.media}" style="width:100%;border-radius:8px;margin-top:8px">`;
      else if(p.media.startsWith('data:image')) media = `<img src="${p.media}" style="width:100%;border-radius:8px;margin-top:8px">`;
    }
    let comments = (p.comments||[]).map(c=>`<div class="comment"><b>${c.user}:</b> ${c.text}</div>`).join('');
    html += `<div class="card">
      <div class="user-row"><div class="avatar">${(p.user||'?').charAt(0).toUpperCase()}</div><div><b>${p.user}</b><br><small style="color:#666">${p.time||''}</small></div></div>
      <p>${formatText(p.caption||'')}</p>
      ${media}
      <div class="actions">
        <button onclick="likePost(${p.id}, ${p.likes})">❤️ Like (${p.likes})</button>
        <button onclick="addComment(${p.id})">💬 Comment</button>
        <button onclick="sharePost('${(p.caption||'').replace(/'/g,'')}')">🔗 Share</button>
      </div>${comments}
    </div>`;
  });
  document.getElementById('feedList').innerHTML = html;
  document.getElementById('myBalance').textContent = getBalance() + " TZS";
  let myPosts = posts.filter(p=>p.user===me).length;
  document.getElementById('myStats').textContent = `Posts zako: ${myPosts}`;
}

function likePost(id, likes){
  let posts = getData('kapappPosts', []);
  let p = posts.find(x=>x.id===id);
  if(!p) return;
  if((p.likedBy||[]).includes(me)) return alert('Umesha-like hii!');
  p.likedBy.push(me);
  p.likes = (p.likes||0)+1;
  saveData('kapappPosts', posts);
  if(p.user !== me){
    let bal = getData('kapappBalance_'+p.user, 0) + 10;
    saveData('kapappBalance_'+p.user, bal);
  } else { addMoney(0); }
  loadFeed();
}

function addComment(id){
  let txt = prompt('Andika comment yako:');
  if(!txt) return;
  let posts = getData('kapappPosts', []);
  let p = posts.find(x=>x.id===id);
  if(!p) return;
  p.comments.push({user: me, text: txt});
  saveData('kapappPosts', posts);
  if(p.user !== me){
    let bal = getData('kapappBalance_'+p.user, 0) + 5;
    saveData('kapappBalance_'+p.user, bal);
  }
  loadFeed();
}

function sharePost(caption){
  navigator.clipboard.writeText(caption + " - Kupitia KAPAPP").then(()=>alert('Imecopywa! Share WhatsApp ✅'));
}

function sendDM(){
  let to = document.getElementById('dmTo').value.trim();
  let txt = document.getElementById('dmText').value.trim();
  if(!to || !txt) return alert('Jaza kwa nani na ujumbe!');
  let dms = getData('kapappDMs', []);
  dms.unshift({from: me, to: to, text: txt, time: new Date().toLocaleString()});
  saveData('kapappDMs', dms);
  document.getElementById('dmText').value = '';
  loadDM();
}

function loadDM(){
  let dms = getData('kapappDMs', []);
  let html = '';
  dms.forEach(m=>{
    if(m.to===me || m.from===me){
      html += `<div class="card"><b>${m.from} → ${m.to}</b><br>${m.text}<br><small>${m.time}</small></div>`;
    }
  });
  if(!html) html = '<div class="card">Hakuna DM bado.</div>';
  document.getElementById('dmList').innerHTML = html;
}

function loadProfile(){
  let posts = getData('kapappPosts', []);
  let my = posts.filter(p=>p.user===me);
  let totalLikes = 0;
  my.forEach(p=> totalLikes += (p.likes||0));
  document.getElementById('profStats').textContent = `Balance: ${getBalance()} TZS • Posts: ${my.length} • Likes: ${totalLikes}`;
  let html = my.map(p=>`<div class="card"><p>${formatText(p.caption)}</p><small>❤️ ${p.likes} • 💬 ${(p.comments||[]).length}</small></div>`).join('');
  if(!html) html = '<div class="card">Hujapost bado.</div>';
  document.getElementById('myPosts').innerHTML = html;
  document.getElementById('myBalance').textContent = getBalance() + " TZS";
}

if(loadUser()){
  startApp();
}
</script>
</body>
</html>
