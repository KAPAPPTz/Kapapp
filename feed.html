<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAPAPP - MPYA</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f5}
.top{background:#1877f2;color:white;padding:12px;text-align:center;font-size:22px;font-weight:bold;position:sticky;top:0;z-index:10}
.top small{display:block;font-size:11px;font-weight:normal;opacity:.9}
.box,.post{background:white;margin:10px;padding:12px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:5px 0;box-sizing:border-box}
button{background:#1877f2;color:white;border:0;padding:11px 20px;border-radius:8px;font-weight:bold;width:100%;cursor:pointer;font-size:16px}
button:disabled{opacity:.6}
.post img{width:100%;border-radius:10px;margin-top:8px}
.actions{display:flex;justify-content:space-between;margin-top:10px;border-top:1px solid #eee;padding-top:8px}
.actions span{cursor:pointer;font-size:14px}
.time{font-size:11px;color:#888}
</style>
</head>
<body>
<div class="top">KAPAPP<small>🌍 LIVE - Dunia nzima inaona</small></div>

<div class="box">
<input id="jina" placeholder="Jina lako...">
<textarea id="wazo" rows="3" placeholder="Una wazo gani leo?"></textarea>
<input type="file" id="picha" accept="image/*">
<button id="btnTuma" onclick="tuma()">Post</button>
</div>

<div id="feed"></div>
<p style="text-align:center;color:#888" id="status">Inapakia post...</p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbC9HurKX3bX2Zu1EdX2wElVXS9mBZKyw",
  authDomain: "kapapp-97bed.firebaseapp.com",
  databaseURL: "https://kapapp-97bed-default-rtdb.firebaseio.com",
  projectId: "kapapp-97bed",
  storageBucket: "kapapp-97bed.firebasestorage.app",
  messagingSenderId: "497811742831",
  appId: "1:497811742831:web:9cf03078065ceb0805ed9a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const postsRef = ref(db, "posts");

// Soma LIVE kutoka Server
onValue(postsRef, (snap) => {
  let feed = document.getElementById('feed');
  feed.innerHTML = '';
  let data = snap.val();
  if(!data){
    document.getElementById('status').innerText = 'Hakuna post bado. Kuwa wa kwanza!';
    return;
  }
  document.getElementById('status').innerText = '';
  let arr = Object.entries(data).reverse();
  arr.forEach(([id, p]) => {
    let div = document.createElement('div');
    div.className = 'post';
    div.innerHTML = '<b>'+(p.jina||'KAPAPP')+'</b> <span class="time">'+new Date(p.time||Date.now()).toLocaleString('sw-TZ')+'</span><p>'+(p.wazo||'')+'</p>' + (p.img ? '<img src="'+p.img+'">' : '') + '<div class="actions"><span onclick="likePost(\''+id+'\')">👍 Like (<b>'+(p.likes||0)+'</b>)</span><span>💬 Comment</span><span>↗️ Share</span></div>';
    feed.appendChild(div);
  });
});

window.tuma = async function(){
  let jina = document.getElementById('jina').value || 'KAPAPP';
  let wazo = document.getElementById('wazo').value;
  let file = document.getElementById('picha').files[0];
  if(!wazo && !file){ alert('Andika kitu kwanza!'); return; }
  document.getElementById('btnTuma').innerText = 'Inatuma...';
  document.getElementById('btnTuma').disabled = true;
  let imgData = '';
  if(file){
    imgData = await new Promise(res => {
      let r = new FileReader();
      r.onload = e => res(e.target.result);
      r.readAsDataURL(file);
    });
