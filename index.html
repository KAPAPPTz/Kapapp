<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapapp</title>
<style>
body{font-family:sans-serif;background:#f0f2f5;margin:0;padding:0}
.header{background:#1877f2;color:#fff;padding:20px;text-align:center;font-size:24px;font-weight:bold}
.header button{background:#fff;color:#1877f2;border:0;padding:8px 15px;border-radius:20px;font-weight:bold}
.card{background:#fff;margin:10px;padding:15px;border-radius:12px;box-shadow:0 2px 5px #ddd}
input,textarea,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
.btn{width:100%;background:#1877f2;color:#fff;border:0;padding:13px;border-radius:8px;font-size:16px;font-weight:bold}
.btn2{background:#42b72a}
h3{margin:5px 0}
.small{color:#666;font-size:13px}
</style>
</head>
<body>
<div class="header">KAPAPP <br><button onclick="alert('Karibu Kapapp!')">Nyumbani</button></div>

<div class="card">
<h3>Karibu Kapapp 👋</h3>
<p class="small">Weka taarifa hapa chini ili kujiunga / kuomba huduma.</p>
<input type="text" id="jina" placeholder="Jina lako kamili">
<input type="tel" id="simu" placeholder="Namba ya simu 07xx...">
<select id="huduma">
<option value="">Chagua Huduma</option>
<option>Mkopo</option>
<option>Akiba</option>
<option>Biashara</option>
<option>Msaada</option>
</select>
<textarea id="ujumbe" placeholder="Andika ujumbe wako hapa..."></textarea>
<button class="btn" onclick="tuma()">TUMA SASA</button>
<p id="matokeo" class="small" style="text-align:center;color:green"></p>
</div>

<div class="card">
<h3>Huduma Zetu</h3>
<p>✅ Mkopo wa haraka</p>
<p>✅ Akiba salama</p>
<p>✅ Msaada wa biashara</p>
<button class="btn btn2" onclick="alert('Asante kwa kutumia Kapapp! Tutakujibu hivi karibuni.')">Wasiliana Nasi</button>
</div>

<script>
function tuma(){
var j=document.getElementById('jina').value;
var s=document.getElementById('simu').value;
if(j==''||s==''){alert('Tafadhali jaza Jina na Simu');return;}
document.getElementById('matokeo').innerHTML='Asante '+j+'! Tumepokea ombi lako. Tutakupigia '+s;
alert('Asante '+j+'! Ombi lako limepokelewa.');
}
</script>
</body>
</html>
