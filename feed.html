<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAPAPP - MPYA</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:0}
.header{background:#1877f2;color:white;text-align:center;padding:15px;font-size:22px;font-weight:bold}
.box{background:white;margin:10px;padding:12px;border-radius:10px}
input,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;background:#1877f2;color:white;border:none;padding:12px;border-radius:8px;font-size:16px;font-weight:bold}
.post{background:white;margin:10px;padding:12px;border-radius:10px}
.post b{color:#1877f2}
.post img{max-width:100%;border-radius:8px;margin-top:8px}
.small{font-size:12px;color:#888;text-align:center;margin:10px}
</style>
</head>
<body>
<div class="header">KAPAPP<br><span style="font-size:13px">🌍 LIVE - Dunia nzima inaona</span></div>

<div class="box">
<input id="jina" placeholder="Jina lako...">
<textarea id="wazo" placeholder="Una wazo gani leo?"></textarea>
<input type="file" id="picha" accept="image/*">
<button onclick="postSasa()">Post</button>
</div>

<div id="feed"></div>
<div class="small"><a href="#" onclick="futaYote();return false;">Futa post zote</a></div>

<script>
let posts = [];
try{ posts = JSON.parse(localStorage.getItem('kapapp_posts')||'[]'); }catch(e){ posts=[]; }
onyesha();

function postSasa(){
  let jina = document.getElementById('jina').value.trim() || 'Mgeni';
  let wazo = document.getElementById('wazo').value.trim();
  if(!wazo){ alert('Andika wazo kwanza!'); return; }
  let file = document.getElementById('picha').files[0];
  if(file){
    let r = new FileReader();
    r.onload = function(e){ hifadhi(jina,wazo,e.target.result); };
    r.readAsDataURL(file);
  } else {
    hifadhi(jina,wazo,'');
  }
}
function hifadhi(jina,wazo,picha){
  posts.unshift({jina:jina,wazo:wazo,picha:picha,tarehe:new Date().toLocaleString()});
  // Tunahifadhi post 10 tu ili simu isijae
  posts = posts.slice(0,10);
  try{ localStorage.setItem('kapapp_posts', JSON.stringify(posts)); }catch(e){ alert('Kumbukumbu imejaa, post za zamani zimefutwa'); posts=posts.slice(0,5); localStorage.setItem('kapapp_posts', JSON.stringify(posts)); }
  document.getElementById('wazo').value='';
  document.getElementById('picha').value='';
  onyesha();
}
function onyesha(){
  let f = document.getElementById('feed');
  if(posts.length==0){ f.innerHTML='<p style="text-align:center;color:#888">Hakuna post bado. Kuwa wa kwanza!</p>'; return; }
  f.innerHTML = posts.map(p=>'<div class="post"><b>'+p.jina+'</b><br><small>'+p.tarehe+'</small><p>'+p.wazo+'</p>'+(p.picha?'<img src="'+p.picha+'">':'')+'</div>').join('');
}
function futaYote(){ if(confirm('Futa post zote?')){ posts=[]; localStorage.removeItem('kapapp_posts'); onyesha(); } }
</script>
</body>
</html>
