<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAPAPP - Pointi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#f0f2f5;padding-bottom:80px}
header{background:#1877f2;color:#fff;padding:14px;text-align:center}
header b{font-size:22px}
.balance{background:#fff;margin:12px;padding:16px;border-radius:12px;text-align:center;box-shadow:0 1px 4px #ccc}
.balance b{color:#0a9e3f;font-size:30px}
.card{background:#fff;margin:12px;padding:14px;border-radius:12px;box-shadow:0 1px 4px #ccc}
input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
button{background:#1877f2;color:#fff;border:none;padding:12px;border-radius:8px;width:100%;font-weight:bold}
.actions{display:flex;gap:6px;margin-top:8px}
.actions button{background:#eef2ff;color:#1877f2;padding:8px}
.post-img{width:100%;border-radius:10px;margin-top:8px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #ddd}
.nav button{background:none;color:#333;width:auto}
</style>
</head>
<body>
<header><b>KAPAPP</b><br><span>Post • Like • Pointi • Pesa</span></header>

<div class="balance">
<p>Pointi Zako Leo</p>
<b id="points">0 Pointi</b>
<p id="money">Tsh 0</p>
<p style="font-size:12px;color:#666">Pointi 100 = Tsh 1,000 • Like = 5 Pointi • Comment = 10 Pointi</p>
</div>

<div class="card">
<h3>Andika Post Mpya</h3>
<textarea id="postText" placeholder="Andika biashara yako hapa..."></textarea>
<input type="text" id="postImg" placeholder="Weka link ya picha (hiari)">
<button onclick="addPost()">POST SASA +20 POINTI</button>
</div>

<div id="feed"></div>

<div class="nav">
<button onclick="location.reload()">🏠 Home</button>
<button onclick="alert('Pointi zako: '+localStorage.getItem('kap_points'))">⭐ Pointi</button>
<button onclick="alert('Ukitaka kutoa pesa, tuma WhatsApp 0755...')">💰 Toa Pesa</button>
</div>

<script>
let points = parseInt(localStorage.getItem('kap_points')||'0');
function updatePoints(){
document.getElementById('points').innerText = points + ' Pointi';
document.getElementById('money').innerText = 'Tsh ' + (points*10);
localStorage.setItem('kap_points', points);
}
let posts = JSON.parse(localStorage.getItem('kap_posts')||'[]');
function render(){
let h='';
posts.forEach((p,i)=>{
h+=`<div class="card"><b>${p.name||'KAPAPP User'}</b><p style="margin:8px 0">${p.text}</p>${p.img?`<img class="post-img" src="${p.img}">`:''}<div class="actions"><button onclick="like(${i})">👍 Like +5</button><button onclick="comment(${i})">💬 Comment +10</button><button onclick="share(${i})">↗️ Share +15</button></div><p style="font-size:12px;color:#888;margin-top:6px">❤️ ${p.likes||0} • 💬 ${p.comments||0}</p></div>`;
});
document.getElementById('feed').innerHTML = h || '<div class="card"><p>Hakuna post bado. Anza ku-post kupata pointi!</p></div>';
}
function addPost(){
let t=document.getElementById('postText').value;
if(!t) return alert('Andika kitu kwanza');
posts.unshift({text:t, img:document.getElementById('postImg').value, likes:0, comments:0, name:'Wewe'});
localStorage.setItem('kap_posts', JSON.stringify(posts));
points+=20; updatePoints(); render();
document.getElementById('postText').value='';
alert('Hongera! Umepata +20 Pointi');
}
function like(i){posts[i].likes++; points+=5; localStorage.setItem('kap_posts', JSON.stringify(posts)); updatePoints(); render();}
function comment(i){let c=prompt('Andika comment yako:'); if(c){posts[i].comments++; points+=10; localStorage.setItem('kap_posts', JSON.stringify(posts)); updatePoints(); render();}}
function share(i){points+=15; updatePoints(); alert('Umepata +15 Pointi kwa Share!');}
updatePoints(); render();
</script>
</body>
</html>
