<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KA-PAPP 🌍</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f2f2f2}
header{background:#ff2a55;color:#fff;text-align:center;padding:15px 10px;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:28px}header p{margin:2px;font-size:13px}
.card{background:#fff;margin:12px;border-radius:15px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:25px;font-size:15px;outline:none}
button{border:none;padding:12px 20px;border-radius:25px;font-weight:bold;cursor:pointer}
.btn-pink{background:#ff2a55;color:#fff;width:100%}
.btn-black{background:#000;color:#fff}
.avatar{width:140px;height:140px;border-radius:50%;background:#ff2a55;color:#fff;font-size:70px;display:flex;align-items:center;justify-content:center;margin:5px auto;overflow:hidden;cursor:pointer;border:3px solid #ffe0e6}
.avatar img{width:100%;height:100%;object-fit:cover}
.post-img{width:100%;border-radius:12px;max-height:320px;object-fit:cover}
.small-ava{width:40px;height:40px;border-radius:50%;background:#ff2a55;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;overflow:hidden;flex-shrink:0}
.small-ava img{width:100%;height:100%;object-fit:cover}
.flex{display:flex;gap:8px;align-items:center}
.post{margin-top:12px}
.topbar{display:flex;gap:8px}
</style>
</head>
<body>
<header><h1>KA-PAPP 🌍</h1><p>Every Language. Every Currency. Every Country.</p></header>

<div class="card" id="authBox">
<div id="profileArea" style="text-align:center;display:none">
<div class="avatar" id="bigAvatar" onclick="document.getElementById('picInput').click()">S</div>
<input type="file" id="picInput" accept="image/*" style="display:none">
<h3 id="welcomeText"></h3>
<p style="color:#ff2a55;font-weight:bold">👤 Profile Yangu</p>
<p>👆 Bonyeza picha yako hapo juu kubadilisha</p>
<p style="color:green;font-size:13px" id="picStatus"></p>
<button class="btn-black" onclick="logout()">Toka / Logout</button>
<button style="background:#eee;color:#333;margin-top:8px;width:100%" onclick="clearAll()">🧹 Safisha App (kama imekwama)</button>
</div>
<div id="loginArea">
<input id="userName" placeholder="Andika Jina Lako...">
<button class="btn-pink" onclick="login()">INGIA ▶️</button>
<p style="text-align:center;font-size:13px;color:#777">Jina tu - Ukija mara ya kwanza unaji-Register</p>
<button style="background:#eee;color:#333;margin-top:8px;width:100%" onclick="clearAll()">🧹 Safisha App (kama INGIA haendi)</button>
</div>
</div>

<div class="card">
<select id="lang"><option>Kiswahili</option><option>English</option><option>Français</option><option>العربية</option><option>中文</option></select>
<select id="curr"><option>TSh</option><option>USD $</option><option>KES</option><option>UGX</option><option>EUR €</option></select>
<div class="topbar"><input id="search" placeholder="🔍 Tafuta bidhaa..." oninput="render()"><button class="btn-black" onclick="alert('DM - Andika ujumbe hapa hivi karibuni')">💬 DM</button></div>
</div>

<div class="card">
<h3>📦 Weka Bidhaa Yako</h3>
<input id="pTitle" placeholder="Jina la bidhaa...">
<input id="pPrice" type="number" placeholder="Bei...">
<textarea id="pDesc" placeholder="Maelezo..."></textarea>
<input type="file" id="pImg" accept="image/*">
<button class="btn-pink" onclick="addPost()">CHAPISHA BIDHAA</button>
<p id="postStatus" style="color:green;font-size:13px"></p>
</div>

<div id="feed"></div>

<script>
function compressImage(file, cb){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      let max = 600;
      if(w > max || h > max){
        if(w > h){ h = h * max / w; w = max; } else { w = w * max / h; h = max; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg', 0.6));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function safeGet(k){
  try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ localStorage.removeItem(k); return null; }
}
let user = safeGet('ka_user');
let posts = safeGet('ka_posts') || [];
function saveUser(){
  try{ localStorage.setItem('ka_user', JSON.stringify(user)); }
  catch(e){ localStorage.removeItem('ka_posts'); posts=[]; try{ localStorage.setItem('ka_user', JSON.stringify(user)); }catch(e2){} }
}
function clearAll(){
  localStorage.removeItem('ka_user'); localStorage.removeItem('ka_posts');
  user=null; posts=[]; alert('Imesafishwa! Sasa andika jina na INGIA tena'); showAuth();
}
function login(){
  let n = document.getElementById('userName').value.trim();
  if(!n){ alert('Andika jina kwanza'); return; }
  if(user && user.name === n){ /* keep pic */ }
  else { user = {name:n, pic: (user && user.pic) ? user.pic : ''}; }
  saveUser(); showAuth();
  alert('Karibu '+n+'! Sasa bonyeza duara S kuweka picha');
}
function logout(){ user=null; localStorage.removeItem('ka_user'); showAuth(); }
function showAuth(){
  let pa=document.getElementById('profileArea'), la=document.getElementById('loginArea');
  if(user){
    pa.style.display='block'; la.style.display='none';
    document.getElementById('welcomeText').innerText='Umeingia kama '+user.name;
    let av=document.getElementById('bigAvatar');
    av.innerHTML = user.pic ? '<img src="'+user.pic+'">' : user.name.charAt(0).toUpperCase();
  } else { pa.style.display='none'; la.style.display='block'; }
  render();
}
document.getElementById('picInput').addEventListener('change', function(e){
  if(!user) return;
  let f=e.target.files[0]; if(!f) return;
  document.getElementById('picStatus').innerText='⏳ Napunguza picha...';
  compressImage(f, function(small){
    user.pic = small; saveUser(); showAuth();
    document.getElementById('picStatus').innerText='✅ Picha imewekwa!';
  });
});
function addPost(){
  if(!user) return alert('Ingia kwanza');
  let t=document.getElementById('pTitle').value.trim();
  let pr=document.getElementById('pPrice').value;
  let d=document.getElementById('pDesc').value;
  if(!t) return alert('Andika jina la bidhaa');
  let f=document.getElementById('pImg').files[0];
  document.getElementById('postStatus').innerText='⏳ Napunguza picha...';
  function doSave(imgData){
    posts.unshift({title:t, price:pr, desc:d, img:imgData||'', name:user.name, pic:user.pic||'', time:new Date().toLocaleString()});
    try{ localStorage.setItem('ka_posts', JSON.stringify(posts)); }catch(e){ posts=posts.slice(0,5); try{ localStorage.setItem('ka_posts', JSON.stringify(posts)); }catch(e2){} }
    document.getElementById('pTitle').value=''; document.getElementById('pPrice').value=''; document.getElementById('pDesc').value='';
    document.getElementById('postStatus').innerText='✅ Imechapishwa!';
    render();
  }
  if(f){ compressImage(f, doSave); } else { doSave(''); }
}
function render(){
  let q=(document.getElementById('search').value||'').toLowerCase();
  let html='';
  posts.filter(p=>(p.title+' '+p.desc).toLowerCase().includes(q)).forEach(p=>{
    let av = p.pic ? '<img src="'+p.pic+'">' : p.name.charAt(0).toUpperCase();
    html+=`<div class="card post"><div class="flex"><div class="small-ava">${av}</div><b>${p.name}</b><small style="color:#888"> ${p.time}</small></div>${p.img?`<img class="post-img" src="${p.img}">`:''}<h3>${p.title}</h3><p>${p.desc||''}</p><b style="color:#ff2a55">${p.price||''} TSh</b><br><br><button class="btn-black" onclick="alert('DM kwa ${p.name}')">💬 DM Muuzaji</button></div>`;
  });
  document.getElementById('feed').innerHTML = html || '<div class="card" style="text-align:center;color:#888">Hakuna bidhaa bado. Weka ya kwanza hapo juu 👆</div>';
}
showAuth();
</script>
</body>
</html>
