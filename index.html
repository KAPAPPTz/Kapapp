<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAPAPP 🇹🇿</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f0f2f5}
header{background:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.logo{font-size:24px;font-weight:900;color:#1877f2} .logo span{color:#ff6600}
.btn{border:none;padding:8px 14px;border-radius:25px;font-weight:bold;cursor:pointer}
.btn-blue{background:#1877f2;color:#fff}.btn-orange{background:#ff6600;color:#fff}.btn-green{background:#25D366;color:#fff;width:100%;padding:12px;font-size:16px}
.search-box{padding:10px}.search-box input{width:100%;padding:13px;border-radius:25px;border:1px solid #ddd;outline:none;font-size:15px}
.banner{background:linear-gradient(45deg,#1877f2,#ff6600);color:#fff;padding:18px;border-radius:18px;margin:0 10px;text-align:center}
.banner h2{margin:0}.banner p{margin:5px 0}
.tabs{display:flex;gap:8px;padding:10px;overflow:auto}.tabs button{white-space:nowrap;border:1px solid #ddd;background:#fff;padding:8px 14px;border-radius:20px}
.stories{display:flex;gap:10px;padding:5px 10px;overflow:auto}.story{text-align:center;min-width:65px}.story div{width:60px;height:60px;border-radius:50%;border:3px solid #ff6600;display:flex;align-items:center;justify-content:center;font-size:28px;background:#fff}
.post-card{background:#fff;border-radius:20px;box-shadow:0 8px 25px rgba(0,0,0,.15);margin:12px;padding:12px;overflow:hidden}
.post-card img{width:100%;border-radius:15px;max-height:320px;object-fit:cover}
.post-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}.avatar{width:42px;height:42px;border-radius:50%;background:#1877f2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px}
.actions{display:flex;gap:10px;margin-top:10px}.actions button{flex:1;border:none;padding:10px;border-radius:25px;background:#f0f2f5;font-weight:bold;cursor:pointer}
.actions button:active{transform:scale(1.1)}
.like-btn.liked{background:#ffe0e0;color:red}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.card{background:#fff;width:100%;max-width:400px;padding:20px;border-radius:20px}.card input,.card textarea,.card select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #ddd;z-index:99}.bottom button{border:none;background:none;font-size:14px;font-weight:bold}.plus{width:55px;height:55px;border-radius:50%;background:#ff6600;color:#fff;font-size:28px;margin-top:-35px;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.sp{height:90px}
</style></head><body>
<header><div class="logo">KAPAPP <span>🇹🇿</span></div><div><button class="btn" onclick="openModal('loginM')">Ingia</button> <button class="btn btn-blue" onclick="openModal('regM')">Jiunge BURE</button></div></header>
<div class="search-box"><input id="search" oninput="render()" placeholder="🔍 Tafuta viatu, wimbo, jina, bei..."></div>
<div class="banner"><h2>KAPAPP IMEFIKA! 🔥</h2><p>Kujiunga ni BURE! Post, Uza, Pata Pesa!</p><button class="btn btn-orange" onclick="openModal('regM')">JIUNGE SASA BURE</button></div>
<div class="tabs"><button onclick="filter='Zote';render()">Zote 🔥</button><button onclick="filter='Biashara';render()">Biashara 🛍️</button><button onclick="filter='Muziki';render()">Muziki 🎵</button><button onclick="filter='Vipaji';render()">Vipaji ⭐</button></div>
<div class="stories"><div class="story"><div>➕</div><small>Wewe</small></div><div class="story"><div>👟</div><small>Said</small></div><div class="story"><div>🎤</div><small>Neema</small></div><div class="story"><div>💄</div><small>Zawadi</small></div><div class="story"><div>⚽</div><small>Baraka</small></div></div>
<div id="feed"></div><div class="sp"></div>
<div class="bottom"><button onclick="window.scrollTo(0,0)">🏠<br>Nyumbani</button><button onclick="openModal('postM')">➕<br>Post</button><button onclick="alert('Karibu KAPAPP!')">👤<br>Zangu</button></div>

<div class="modal" id="regM"><div class="card"><h2>JIUNGE BURE! 🎉</h2><input id="rName" placeholder="Jina lako"><input id="rPhone" placeholder="Namba ya simu 07xx"><input id="rPass" type="password" placeholder="Password"><button class="btn-green" onclick="register()">JIUNGE SASA</button><p style="text-align:center" onclick="closeAll()">Funga ✖️</p></div></div>
<div class="modal" id="loginM"><div class="card"><h2>Karibu Tena! 👋</h2><input id="lPhone" placeholder="Namba ya simu"><input id="lPass" type="password" placeholder="Password"><button class="btn-green" onclick="login()">INGIA</button><p style="text-align:center" onclick="closeAll()">Funga ✖️</p></div></div>
<div class="modal" id="postM"><div class="card"><h2>Weka Post Mpya ➕</h2><input id="pTitle" placeholder="Andika nini? mf: Viatu vizuri 25,000"><select id="pCat"><option>Biashara</option><option>Muziki</option><option>Vipaji</option></select><input id="pPrice" placeholder="Bei mf: 25000"><input id="pPhone" placeholder="Namba yako ya WhatsApp"><button class="btn-green" onclick="addPost()">POST SASA 🚀</button><p style="text-align:center" onclick="closeAll()">Funga ✖️</p></div></div>

<script>
let filter='Zote';
let posts=JSON.parse(localStorage.getItem('kapapp_posts')||'null')||[
{id:1,name:'Said Kapwile',cat:'Biashara',title:'Viatu Vizuri Original - 25,000/= tu!',price:'25,000',phone:'255688472790',img:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600',likes:124,comments:['Nzuri sana!','Nipo Dar, niletee']},
{id:2,name:'Neema M.',cat:'Muziki',title:'Wimbo Mpya - Nitakupenda 🎤🔥 Sikiliza!',price:'Bure',phone:'255688472790',img:'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=600',likes:89,comments:['Sauti kali!']},
{id:3,name:'Zawadi Shop',cat:'Biashara',title:'Mafuta ya Nywele Asili - 15,000/=!',price:'15,000',phone:'255688472790',img:'https://images.unsplash.com/photo-1522337660859-02fbefca4702?w=600',likes:56,comments:[]}
];
function openModal(id){closeAll();document.getElementById(id).classList.add('show')}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'))}
function render(){
 let q=(document.getElementById('search').value||'').toLowerCase();
 let html='';
 posts.filter(p=>(filter=='Zote'||p.cat==filter)&&(p.title.toLowerCase().includes(q)||p.name.toLowerCase().includes(q))).forEach(p=>{
  html+=`<div class="post-card"><div class="post-top"><div class="avatar">${p.name[0]}</div><div><b>${p.name} ${p.name.includes('Said')?'✅':''}</b><br><small>${p.cat} • Sasa hivi</small></div></div><p><b>${p.title}</b></p><img src="${p.img}"><p>💰 Bei: <b>${p.price}</b></p><div class="actions"><button class="like-btn" onclick="like(${p.id},this)">❤️ ${p.likes}</button><button onclick="comment(${p.id})">💬 ${p.comments.length} Comment</button><button onclick="window.open('https://wa.me/${p.phone}?text=Nimeona post yako KAPAPP: ${encodeURIComponent(p.title)}')">💚 WhatsApp</button></div><div style="background:#f5f5f5;padding:8px;border-radius:10px;margin-top:8px">${p.comments.map(c=>'<div>👤 '+c+'</div>').join('')||'<small>Hakuna comment bado - Kuwa wa kwanza!</small>'}</div></div>`;
 });
 document.getElementById('feed').innerHTML=html||'<p style="text-align:center">Hakuna kitu kilichopatikana 😔</p>';
}
function like(id,btn){let p=posts.find(x=>x.id==id);p.likes++;btn.classList.add('liked');btn.innerHTML='❤️ '+p.likes;localStorage.setItem('kapapp_posts',JSON.stringify(posts))}
function comment(id){let t=prompt('Andika comment yako:');if(t){let p=posts.find(x=>x.id==id);p.comments.push(t);localStorage.setItem('kapapp_posts',JSON.stringify(posts));render();}}
function register(){if(!document.getElementById('rName').value||!document.getElementById('rPhone').value){alert('Jaza jina na namba!');return}alert('Hongera '+document.getElementById('rName').value+'! Umejiunga KAPAPP! 🎉');closeAll();}
function login(){alert('Karibu tena KAPAPP!');closeAll();}
function addPost(){let t=document.getElementById('pTitle').value;if(!t){alert('Andika kitu kwanza!');return}posts.unshift({id:Date.now(),name:'Wewe ✅',cat:document.getElementById('pCat').value,title:t,price:document.getElementById('pPrice').value||'Bure',phone:document.getElementById('pPhone').value||'255688472790',img:'https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=600',likes:0,comments:[]});localStorage.setItem('kapapp_posts',JSON.stringify(posts));closeAll();render();alert('Post yako imewekwa! 🚀');}
render();
setTimeout(()=>{if(!localStorage.getItem('seen')){openModal('regM');localStorage.setItem('seen','1')}},2000);
</script></body></html>
