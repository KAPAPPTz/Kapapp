<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAPAPP SOKO 🛒 - Bidhaa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;padding-bottom:80px}
header{position:fixed;top:0;left:0;right:0;background:#000;padding:12px;text-align:center;z-index:99;border-bottom:1px solid #222}
header h1{font-size:26px} header h1 b{color:#fe2c55}
.nav{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.nav button{padding:7px 11px;border-radius:20px;border:0;background:#222;color:#fff;font-weight:bold}
.nav button.active{background:#fe2c55}
.wrap{margin-top:130px;padding:10px}
.search{display:flex;gap:6px;margin-bottom:10px}
.search input{flex:1;padding:11px;border-radius:20px;border:0;background:#222;color:#fff}
.search button{padding:11px;border-radius:20px;border:0;background:#fe2c55;color:#fff;font-weight:bold}
.box{background:#111;padding:14px;border-radius:16px;margin-bottom:10px}
.box input,.box textarea,.box select{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:0;background:#222;color:#fff}
.box button{width:100%;padding:12px;background:#fe2c55;color:#fff;border:0;border-radius:12px;font-weight:bold;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#111;border-radius:16px;overflow:hidden;border:1px solid #222}
.card img{width:100%;height:150px;object-fit:cover}
.card .p{padding:10px}
.card .price{color:#25D366;font-weight:bold;font-size:16px}
.card button{width:100%;padding:9px;border:0;border-radius:10px;font-weight:bold;margin-top:6px}
.btnWA{background:#25D366;color:#fff} .btnCart{background:#fe2c55;color:#fff}
.hidden{display:none}
.cart{position:fixed;bottom:0;left:0;right:0;background:#111;padding:12px;border-top:2px solid #fe2c55;z-index:99;text-align:center}
</style>
</head>
<body>
<header><h1>KAP<b>APP</b> SOKO 🛒</h1><p>CEO: KAPWILE | Tanzania 🇹🇿 | Nunua na Uza Hapa!</p>
<div class="nav">
<button onclick="location.href='index.html'">🏠 KAPAPP</button>
<button class="active">🛒 Bidhaa</button>
<button onclick="showAdd()">➕ Uza Bidhaa</button>
<button onclick="showCart()">🧺 Kikapu <span id="cartNum">0</span></button>
</div></header>

<div class="wrap">
<div class="search"><input id="s" placeholder="🔍 Tafuta bidhaa... simu, nguo, viatu..."><button onclick="doSearch()">Tafuta</button></div>

<div class="box" style="display:flex;gap:6px;overflow:auto">
<button onclick="filterCat('Vyote')" style="background:#fe2c55">Vyote</button>
<button onclick="filterCat('Simu')" style="background:#222">📱 Simu</button>
<button onclick="filterCat('Nguo')" style="background:#222">👕 Nguo</button>
<button onclick="filterCat('Viatu')" style="background:#222">👟 Viatu</button>
<button onclick="filterCat('Chakula')" style="background:#222">🍔 Chakula</button>
<button onclick="filterCat('Nyumbani')" style="background:#222">🏠 Nyumbani</button>
</div>

<div id="addBox" class="box hidden">
<h2>➕ Uza Bidhaa Yako - BURE!</h2>
<input id="bName" placeholder="Jina la bidhaa... mf: Samsung A14">
<input id="bPrice" type="number" placeholder="Bei... mf: 350000">
<select id="bCat"><option>Simu</option><option>Nguo</option><option>Viatu</option><option>Chakula</option><option>Nyumbani</option><option>Nyingine</option></select>
<input id="bPhone" placeholder="Namba yako ya WhatsApp... mf: 0755000000">
<input id="bImg" placeholder="Link ya picha ya bidhaa (hiari)">
<textarea id="bDesc" placeholder="Eleza bidhaa yako..."></textarea>
<button onclick="addBidhaa()">🚀 WEKA SOKONI SASA</button>
<small style="color:#aaa">Bidhaa yako itaonekana hapa mara moja. Mtu akipenda, atakutafuta WhatsApp!</small>
</div>

<div id="grid" class="grid"></div>
</div>

<div class="cart">🧺 Kikapu: <b id="cartTotal">TSh 0</b> | Bidhaa: <b id="cartCount">0</b> <button onclick="checkout()" style="padding:8px 14px;background:#25D366;color:#fff;border:0;border-radius:20px;font-weight:bold;margin-left:8px">💚 Agiza WhatsApp</button></div>

<script>
let products=[
{name:"Samsung Galaxy A14",price:350000,cat:"Simu",phone:"0755000000",desc:"Mpya, box kamili, warranty 1 mwaka",img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400"},
{name:"Nike Air - Viatu Kali",price:85000,cat:"Viatu",phone:"0755000000",desc:"Size 40-45, rangi zote zipo",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"},
{name:"T-Shirt KAPAPP 👑",price:25000,cat:"Nguo",phone:"0755000000",desc:"Original KAPAPP, pamba safi!",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"},
{name:"Smart Watch",price:95000,cat:"Simu",phone:"0755000000",desc:"Inapima mapigo, ina Bluetooth",img:"https://images.unsplash.com/photo-1579586337278-3befd40fd17a?w=400"},
{name:"Biriani ya KAPAPP",price:12000,cat:"Chakula",phone:"0755000000",desc:"Tamuuu! Delivery Dar es Salaam",img:"https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=400"},
{name:"Headphone Bluetooth",price:45000,cat:"Simu",phone:"0755000000",desc:"Sauti kali, battery siku 2",img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"}
];
let cart=[]; let filter="Vyote";
function render(){
let g=document.getElementById('grid'); g.innerHTML='';
let list=products.filter(p=>(filter==='Vyote'||p.cat===filter) && (!document.getElementById('s').value || p.name.toLowerCase().includes(document.getElementById('s').value.toLowerCase())));
if(list.length==0) g.innerHTML='<p style="grid-column:span 2;text-align:center;padding:20px">Hakuna bidhaa 😢</p>';
list.forEach((p,i)=>{
let idx=products.indexOf(p);
g.innerHTML+=`<div class="card"><img src="${p.img}"><div class="p"><b>${p.name}</b><br><small>${p.cat} • ${p.desc}</small><br><div class="price">TSh ${p.price.toLocaleString()}</div><button class="btnCart" onclick="addCart(${idx})">🧺 Weka Kikapu</button><button class="btnWA" onclick="orderWA('${p.name}',${p.price},'${p.phone}')">💚 Agiza WhatsApp</button></div></div>`;
});
}
function addCart(i){cart.push(products[i]); updateCart(); alert(products[i].name+' imewekwa kikapuni! 🧺');}
function updateCart(){document.getElementById('cartNum').innerText=cart.length; document.getElementById('cartCount').innerText=cart.length; let t=cart.reduce((a,b)=>a+b.price,0); document.getElementById('cartTotal').innerText='TSh '+t.toLocaleString();}
function checkout(){if(cart.length==0) return alert('Kikapu kiko tupu! Chagua bidhaa kwanza 🧺'); let msg='Ninataka kuagiza KAPAPP SOKO 🛒:\n\n'+cart.map(c=>'• '+c.name+' - TSh '+c.price.toLocaleString()).join('\n')+'\n\nJumla: TSh '+cart.reduce((a,b)=>a+b.price,0).toLocaleString(); window.open('https://wa.me/255755000000?text='+encodeURIComponent(msg),'_blank');}
function orderWA(name,price,phone){let msg='Habari! Nimeona '+name+' - TSh '+price.toLocaleString()+' kwenye KAPAPP SOKO 🛒. Ipo?'; window.open('https://wa.me/255'+phone.replace(/^0/,'')+'?text='+encodeURIComponent(msg),'_blank');}
function showAdd(){document.getElementById('addBox').classList.toggle('hidden'); window.scrollTo(0,120);}
function showCart(){alert('Kikapu chako:\n'+(cart.length?cart.map(c=>'• '+c.name).join('\n'):'Hakuna kitu')+'\n\nBonyeza Agiza WhatsApp chini!');}
function filterCat(c){filter=c; render();}
function doSearch(){render();}
function addBidhaa(){
let n=document.getElementById('bName').value; let pr=parseInt(document.getElementById('bPrice').value); let cat=document.getElementById('bCat').value; let ph=document.getElementById('bPhone').value; let img=document.getElementById('bImg').value||'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'; let d=document.getElementById('bDesc').value||'Bidhaa kali kutoka KAPAPP!';
if(!n||!pr) return alert('Weka jina na bei!');
products.unshift({name:n,price:pr,cat:cat,phone:ph,desc:d,img:img}); render(); document.getElementById('addBox').classList.add('hidden'); alert('Hongera! '+n+' imewekwa sokoni! 🎉 Watu wataiona sasa!');
}
render();
</script>
</body>
</html>
